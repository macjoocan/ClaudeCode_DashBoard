<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code 세션 런처</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312100e'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d97757'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root{
    --bg:#12100e; --panel:#1a1815; --panel2:#211e1a; --panel3:#282420;
    --line:#302b25; --line2:#3d372f;
    --fg:#efe9e1; --dim:#a49a8d; --dim2:#6f665b;
    --accent:#d97757; --accent2:#e89b7f;
    --busy:#e0b341; --idle:#5fa8d3; --ok:#7fb069; --bad:#c0554a;
    --hh:120px;   /* 헤더 높이 - 터미널 영역 계산에 쓴다 */
  }
  *{box-sizing:border-box}
  /* display 를 지정한 규칙이 hidden 속성을 덮어쓰지 못하게 한다 (#list, #termwrap) */
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 "Pretendard","Malgun Gothic",system-ui,-apple-system,sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#3a342c;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------------- 헤더 / 탭 ---------------- */
  header{position:sticky;top:0;z-index:20;background:rgba(18,16,14,.96);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px 0}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.2px;white-space:nowrap}
  h1 .dot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--accent);
    margin-right:8px;vertical-align:1px}
  #q{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;color:var(--fg);padding:7px 12px;font:inherit;outline:none}
  #q:focus{border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
  .seg button{background:var(--panel2);border:none;color:var(--dim);padding:6px 11px;
    font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#1a1008;font-weight:600}
  .seg button:not(.on):hover{color:var(--fg)}
  .tabs{display:flex;gap:2px;margin-top:11px}
  .tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
    padding:8px 15px 9px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap;
    border-radius:6px 6px 0 0}
  .tab:hover{color:var(--fg);background:var(--panel)}
  .tab.on{color:var(--accent2);border-bottom-color:var(--accent);font-weight:600}
  .tab .n{display:inline-block;background:var(--panel3);color:var(--dim);border-radius:10px;
    padding:0 7px;font-size:11px;margin-left:6px;font-weight:600}
  .tab.on .n{background:var(--accent);color:#1a1008}
  .meta{color:var(--dim2);font-size:11.5px;padding:4px 0 3px;display:flex;gap:14px;flex-wrap:wrap}

  /* ---------------- 토큰 사용량 (최상단) ---------------- */
  .tokbar{display:flex;gap:0;align-items:stretch;flex:none;cursor:help;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;
    font-size:11.5px;line-height:1}
  .tokbar .tk{display:flex;flex-direction:column;gap:2px;padding:5px 10px;justify-content:center}
  .tokbar .tk+.tk{border-left:1px solid var(--line)}
  .tokbar .tl{color:var(--dim2);font-size:9.5px;letter-spacing:.2px}
  .tokbar .tv{font-weight:650;font-size:12.5px;font-variant-numeric:tabular-nums}
  .tokbar .tk.now .tv{color:var(--busy)}
  .tokbar .tk.sub .tv{color:var(--dim);font-weight:500;font-size:11.5px}
  .tokbar:hover{border-color:var(--accent)}

  /* ---------------- 버튼 ---------------- */
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1008;font-weight:600}
  .btn.primary:hover{background:var(--accent2);border-color:var(--accent2);color:#1a1008}
  .btn.live{background:var(--idle);border-color:var(--idle);color:#08131a;font-weight:600}
  .btn.live:hover{background:#7cc0e4;border-color:#7cc0e4;color:#08131a}
  .btn.ghost{background:transparent;color:var(--dim);border-color:transparent}
  .btn.ghost:hover{background:var(--panel2);border-color:var(--line)}
  .btn.xs{padding:3px 8px;font-size:11.5px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .icon{background:none;border:none;cursor:pointer;color:var(--dim2);padding:2px 4px;
    font-size:14px;line-height:1}
  .icon:hover{color:var(--accent2)}
  .icon.on{color:var(--busy)}

  /* ---------------- 카드 그리드 ---------------- */
  main{padding:16px 20px 70px;max-width:1600px;margin:0 auto}
  main.termmode{padding:0;max-width:none}
  .grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
  .grid.wide{grid-template-columns:1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column}
  .card.missing{opacity:.45}
  .card.hasbusy{border-color:#6b5620}
  .chead{padding:12px 13px 10px;display:flex;gap:9px;align-items:flex-start}
  .st{width:9px;height:9px;border-radius:5px;flex:none;margin-top:5px;background:var(--dim2)}
  .st.idle{background:var(--idle);box-shadow:0 0 0 3px rgba(95,168,211,.16)}
  .st.busy{background:var(--busy);box-shadow:0 0 0 3px rgba(224,179,65,.18);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .cname{font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cpath{color:var(--dim2);font-size:11px;font-family:Consolas,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
  .ctags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .tag{font-size:10.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);
    border-radius:20px;padding:1px 8px;white-space:nowrap}
  .tag.br{color:var(--ok)} .tag.run{color:var(--busy);border-color:#5c4a1c}
  .tag.emb{color:var(--idle);border-color:#2c4a5c}
  .tag.err{color:var(--bad);border-color:#5c2b25}
  .grow{flex:1;min-width:0}

  /* ---------------- 세션 행 ---------------- */
  .slist{border-top:1px solid var(--line)}
  .s{padding:9px 13px;border-bottom:1px solid #221f1b;cursor:pointer}
  .s:last-child{border-bottom:none}
  .s:hover{background:var(--panel2)}
  .s.sel{background:var(--panel3);box-shadow:inset 2px 0 0 var(--accent)}
  .sl1{display:flex;gap:7px;align-items:center}
  .stitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .swhen{color:var(--dim2);font-size:11px;flex:none}
  .slast{color:var(--dim2);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;margin:2px 0 0 16px}
  .slast::before{content:"\21b3 ";color:var(--accent);opacity:.65}
  .sacts{display:flex;gap:5px;margin:7px 0 1px 16px}
  .cfoot{margin-top:auto;border-top:1px solid var(--line);background:var(--panel2);
    padding:9px 13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .more{padding:8px 13px;color:var(--dim);font-size:12px;cursor:pointer;background:var(--panel2);
    border-top:1px solid var(--line)}
  .more:hover{color:var(--accent2)}

  /* 즐겨찾기 / 실행중 탭의 세션 카드 */
  .card.sc .chead{padding-bottom:8px}
  .card.sc .proj{font-size:11px;color:var(--dim);margin-bottom:3px}
  .card.sc .body{padding:0 13px 11px}
  .card.sc .lastq{color:var(--dim);font-size:12px;background:var(--panel2);
    border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:6px 9px;margin-top:4px;
    cursor:pointer;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;max-height:calc(4.5em + 12px)}
  .card.sc .lastq:hover{color:var(--fg)}

  /* ---------------- 내장 터미널 ---------------- */
  #termwrap{display:flex;flex-direction:column;height:calc(100vh - var(--hh))}
  .termbar{display:flex;gap:4px;align-items:center;padding:7px 12px;background:var(--panel);
    border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
  .tt{display:flex;gap:7px;align-items:center;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:5px 8px 5px 10px;cursor:pointer;white-space:nowrap;font-size:12.5px}
  .tt:hover{border-color:var(--line2)}
  .tt.on{background:var(--panel3);border-color:var(--accent)}
  .tt.shown:not(.on){border-color:var(--line2);background:var(--panel3)}
  .tt.dead{opacity:.5}
  .tt .st{margin-top:0}
  .tt .lbl{overflow:hidden;text-overflow:ellipsis;max-width:190px;line-height:1.25}
  .tt .sub{color:var(--dim2);font-size:10.5px}
  .tt .x{color:var(--dim2);font-size:13px;line-height:1;padding:0 2px}
  .tt .x:hover{color:var(--bad)}
  .termhost{flex:1;background:var(--bg);overflow:hidden;padding:6px;min-height:0}
  /* 분할 패인 - termhost 가 grid 로 배치한다 (term.js 의 apply()) */
  .termpane{display:flex;flex-direction:column;min-width:0;min-height:0;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .termpane.active{border-color:var(--accent)}
  .termpane.solo{border-color:var(--line)}
  .termpane.solo.active{border-color:var(--accent)}
  .termpane .ph2{display:flex;gap:7px;align-items:center;padding:5px 7px 5px 9px;flex:none;
    background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px}
  .termpane.active .ph2{background:var(--panel3)}
  .termpane .ph2 .st{margin-top:0}
  .termpane .ph2 .nm{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
  .termpane .ph2 .pj{color:var(--dim2);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .termpane .ph2 .sp{flex:1}
  .termpane .ph2 .pbtn{background:none;border:none;color:var(--dim2);cursor:pointer;
    font-size:12px;line-height:1;padding:2px 4px;border-radius:4px}
  .termpane .ph2 .pbtn:hover{color:var(--accent2);background:var(--panel)}
  .termpane .ph2 .pbtn.warn:hover{color:var(--busy)}
  .termpane .pb2{flex:1;min-height:0;padding:6px 2px 4px 8px;overflow:hidden}
  .termpane .xterm{height:100%}

  /* 자리 옮기기 - 머리글을 잡고 끈다 */
  .termpane .ph2{user-select:none;cursor:grab}
  .termpane .ph2 .grip{color:var(--dim2);font-size:12px;letter-spacing:-2px;flex:none}
  .termpane.drag{opacity:.5}
  .termpane.dropto{border-color:var(--accent2)}
  .termpane.dropto .ph2{background:var(--accent2);color:var(--bg)}
  body.panedrag,body.panedrag *{cursor:grabbing!important;user-select:none!important}

  /* 크기 조절 손잡이 - 패인 사이 틈에 얹는 absolute 오버레이.
     grid 자식으로 넣으면 패인 자동 배치에 끼어들어 칸이 밀린다. */
  .termguts{position:absolute;inset:0;pointer-events:none;z-index:5}
  .gut{position:absolute;pointer-events:auto;border-radius:3px;background:transparent;
    transition:background .12s}
  .gut.gc{top:0;bottom:0;width:11px;margin-left:-5.5px;cursor:col-resize}
  .gut.gr{left:0;right:0;height:11px;margin-top:-5.5px;cursor:row-resize}
  .gut:hover{background:var(--line2)}
  .gut.on{background:var(--accent)}
  body.gcdrag,body.gcdrag *{cursor:col-resize!important;user-select:none!important}
  body.grdrag,body.grdrag *{cursor:row-resize!important;user-select:none!important}
  .termempty{flex:1;display:flex;flex-direction:column;gap:12px;
    align-items:center;justify-content:center;color:var(--dim);text-align:center;line-height:1.9}
  /* 분할 선택기 */
  .lay{display:flex;gap:3px;align-items:center;margin-left:6px;padding-left:8px;
    border-left:1px solid var(--line)}
  .lay button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    border-radius:6px;min-width:30px;height:26px;padding:0 8px;font:inherit;font-size:11.5px;
    cursor:pointer;white-space:nowrap;flex:none}
  .lay button.on{background:var(--accent);border-color:var(--accent);color:#1a1008;font-weight:700}
  .lay button:not(.on):hover{color:var(--fg);border-color:var(--line2)}
  .lay .lb{color:var(--dim2);font-size:11px;margin-right:3px}
  .clip{color:var(--dim2);font-size:10.5px;margin-left:8px;padding-left:9px;
    border-left:1px solid var(--line);cursor:help;white-space:nowrap;flex:none}
  .clip kbd{font-size:10px;padding:0 4px}

  /* ---------------- 대화 패널 ---------------- */
  #panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);z-index:30;
    background:var(--panel);border-left:1px solid var(--line2);display:flex;flex-direction:column;
    transform:translateX(102%);transition:transform .2s ease;box-shadow:-18px 0 50px rgba(0,0,0,.45)}
  #panel.show{transform:none}
  #panel .ph{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
  #panel .pt{font-weight:650;font-size:14px;line-height:1.35}
  #panel .ps{color:var(--dim2);font-size:11.5px;margin-top:3px}
  #panel .pa{padding:9px 15px;border-bottom:1px solid var(--line);display:flex;gap:6px;
    align-items:center;flex-wrap:wrap;background:var(--panel2)}
  #log{flex:1;overflow-y:auto;padding:14px 15px 40px}
  .m{margin-bottom:13px;font-size:13px}
  .m .who{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    color:var(--dim2);margin-bottom:3px;display:flex;gap:7px;align-items:center}
  .m .txt{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
  .m.user .who{color:var(--accent2)}
  .m.user .txt{background:var(--panel3);border-left:2px solid var(--accent);
    border-radius:0 7px 7px 0;padding:8px 11px}
  .m.assistant .who{color:var(--ok)}
  .m.assistant .txt{color:#ded7cd}
  .m.thinking{opacity:.55;font-size:12px;font-style:italic}
  .m.thinking .txt{color:var(--dim);max-height:4.6em;overflow:hidden}
  .m.thinking.open .txt{max-height:none}
  .m.tool .txt{color:var(--idle);font-family:Consolas,monospace;font-size:11.5px;
    background:var(--panel2);border-radius:6px;padding:4px 9px;display:inline-block}
  .m .txt code{font-family:Consolas,monospace;font-size:12px;background:var(--panel3);
    border-radius:4px;padding:1px 5px;color:var(--accent2)}
  .m .txt code.blk{display:block;padding:9px 11px;margin:5px 0;overflow-x:auto;
    white-space:pre;color:#cfc7bb;border:1px solid var(--line);line-height:1.45}
  .m .txt strong{color:#fff;font-weight:650}
  .m .txt b.h{display:block;color:var(--accent2);font-size:13.5px;margin:9px 0 2px}
  .m .ts{color:var(--dim2);font-weight:400;font-size:10px;letter-spacing:0}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;opacity:0;
    pointer-events:none;transition:opacity .2s}
  #scrim.show{opacity:1;pointer-events:auto}

  /* ---------------- 구성 탭 ---------------- */
  #cfgwrap{padding:16px 20px 70px;max-width:1240px;margin:0 auto}
  .hcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:13px}
  .hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px 22px}
  .kv{display:flex;gap:10px;align-items:baseline;font-size:12.5px;min-width:0}
  .kv .k{color:var(--dim2);flex:none;min-width:88px}
  .kv .v{color:var(--fg);font-weight:600;overflow-wrap:anywhere}
  .kv .v.ok{color:var(--ok)} .kv .v.bad{color:var(--busy)}
  .hsrc{color:var(--dim2);font-size:11px;font-family:Consolas,monospace;margin-top:10px}
  .hsec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden}
  .hsec>summary{cursor:pointer;padding:12px 15px;display:flex;gap:10px;align-items:center;
    list-style:none;font-size:13.5px}
  .hsec>summary::-webkit-details-marker{display:none}
  .hsec>summary::before{content:"▸";color:var(--dim2);font-size:11px;transition:transform .15s}
  .hsec[open]>summary::before{transform:rotate(90deg)}
  .hsec>summary:hover{background:var(--panel2)}
  .hsec .ht{font-weight:650}
  .hsec .hn{background:var(--panel3);color:var(--dim);border-radius:10px;padding:0 8px;font-size:11px;font-weight:600}
  .hbody{padding:2px 15px 15px;border-top:1px solid var(--line)}
  .subh{color:var(--accent2);font-size:11.5px;font-weight:650;margin:14px 0 7px;
    padding-top:10px;border-top:1px solid var(--line)}
  .dimtxt{color:var(--dim2);font-size:11.5px}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;
    padding:2px 9px;font-size:11px;color:var(--dim);margin:0 4px 4px 0;white-space:nowrap}
  .chip.off{opacity:.45;text-decoration:line-through}
  .chip.warnc{color:var(--busy);border-color:#5c4a1c}
  .chip.mchip{color:var(--idle);border-color:#2c4a5c}
  /* 경고 */
  .warngroup{margin:12px 0}
  .wh{font-size:12.5px;font-weight:650;margin-bottom:6px;color:var(--dim)}
  .wh.warn{color:var(--busy)} .wh.info{color:var(--idle)}
  .wi{padding:5px 0 5px 10px;border-left:2px solid var(--line);margin-bottom:3px}
  .wi code{font-family:Consolas,monospace;font-size:11.5px;color:#ded7cd;overflow-wrap:anywhere}
  .wt{color:var(--dim2);font-size:11px;margin-top:2px}
  /* 훅 */
  .hookev{margin:12px 0}
  .he{font-size:12.5px;font-weight:650;color:var(--accent2);display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .hn2{background:var(--panel3);color:var(--dim);border-radius:10px;padding:0 7px;font-size:10.5px}
  .hook{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:baseline;
    padding:5px 0;border-bottom:1px solid #221f1b;font-size:11.5px}
  .hook.off{opacity:.42}
  .hmatch{color:var(--idle);font-family:Consolas,monospace;overflow:hidden;text-overflow:ellipsis}
  .hook code{font-family:Consolas,monospace;color:#ded7cd;overflow-wrap:anywhere}
  .hfrom{color:var(--dim2);font-size:10.5px;white-space:nowrap}
  .hlabel{color:var(--accent2);font-size:10.5px;margin-top:2px}
  /* MCP */
  .mcplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:10px}
  .mcp{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .mn{font-weight:650;font-size:12.5px;display:flex;gap:8px;align-items:center}
  .mt{color:var(--dim2);font-size:10.5px;font-weight:400}
  .mcp code{display:block;font-family:Consolas,monospace;font-size:11px;color:var(--dim);
    margin-top:4px;overflow-wrap:anywhere}
  /* 플러그인 */
  .pluglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:10px}
  .plug{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 11px}
  .plug.off{opacity:.55}
  .pn{font-weight:650;font-size:12.5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .pv{color:var(--dim2);font-size:10.5px;font-weight:400}
  .dot2{width:7px;height:7px;border-radius:4px;background:var(--dim2);flex:none}
  .dot2.on{background:var(--ok)}
  .pprov{margin-top:7px}
  /* 권한 */
  .hfilter{width:100%;margin:10px 0;background:var(--panel2);border:1px solid var(--line);
    border-radius:7px;color:var(--fg);padding:6px 11px;font:inherit;font-size:12.5px;outline:none}
  .hfilter:focus{border-color:var(--accent)}
  .rules{display:flex;flex-wrap:wrap;gap:5px}
  .rule{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;
    font-family:Consolas,monospace;font-size:11px;color:#ded7cd;max-width:100%;overflow-wrap:anywhere}
  .rule.risky{border-color:#5c4a1c;color:var(--busy)}
  .rule.deny{border-color:#5c2b25;color:var(--bad)}
  .rule .chip{margin:0 0 0 6px;padding:0 6px}
  /* 스킬·에이전트 */
  .agl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .ag{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .an{font-weight:650;font-size:12.5px}
  .as{color:var(--dim2);font-size:10.5px;margin-top:2px}
  .ad{color:var(--dim);font-size:11px;margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .skl{line-height:2}
  /* 프로젝트 파일 */
  .pf{margin:11px 0}
  .pfn{font-family:Consolas,monospace;font-size:11.5px;color:var(--dim);margin-bottom:5px}
  .pfi{display:flex;gap:10px;align-items:baseline;padding:4px 9px;background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;margin:0 0 4px 12px;cursor:pointer}
  .pfi:hover{border-color:var(--accent)}
  .pfk{font-family:Consolas,monospace;font-size:11.5px;color:var(--accent2)}

  /* ---------------- 실황 타임라인 ---------------- */
  #tlwrapouter{padding:14px 20px 70px}
  .tlbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:11px;font-size:12px}
  .tlbar .seg button{padding:5px 10px}
  .tllegend{display:flex;gap:11px;align-items:center;color:var(--dim2);font-size:10.5px;flex-wrap:wrap}
  /* padding:0/border:none 을 못 박아둔다 - .mcp 같은 카드 스타일과 클래스가 겹친다 */
  .tllegend i.sp{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;
    vertical-align:-1px;padding:0;border:none;flex:none}
  .tlwrap{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    overflow:hidden}
  .tllabels{position:relative;width:170px;flex:none;border-right:1px solid var(--line);
    background:var(--panel2)}
  .tllabel{position:absolute;left:0;right:0;display:flex;gap:5px;align-items:center;
    padding:0 8px;font-size:11.5px;overflow:hidden}
  .tllabel.agent{padding-left:14px;color:#cb9bdc}
  .tllabel .st{margin-top:0;width:7px;height:7px}
  .tlbranch{color:var(--dim2);font-size:10px}
  .tlname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .tllabel.agent .tlname{font-weight:500}
  .tlmeta{margin-left:auto;color:var(--dim2);font-size:10px;white-space:nowrap}
  .tlchart{flex:1;min-width:0;overflow:hidden}
  .tlsvg{width:100%;display:block}
  .tlgrid{stroke:#241f1b;stroke-width:1}
  .tltick{font:9px Consolas,monospace;fill:var(--dim2)}
  .tllane{fill:#191714}
  .tllane.agent{fill:#15181c}
  .tlspan rect{fill:var(--dim2);stroke:none}
  .tlspan text{font:9.5px Consolas,monospace;fill:#0e0c0a;pointer-events:none}
  .tlspan.read  rect{fill:#5fa8d3} .tlspan.write rect{fill:#e0b341}
  .tlspan.run   rect{fill:#7fb069} .tlspan.agent rect{fill:#cb9bdc}
  .tlspan.mcp   rect{fill:#5fb3b3} .tlspan.net   rect{fill:#d97757}
  .tlspan.skill rect{fill:#b07cc6} .tlspan.etc   rect{fill:#8a8074}
  .tlspan.failed rect{fill:#c0554a}
  .tlspan.failed text{fill:#fff}
  .tlspan.running rect{animation:tlpulse 1.2s ease-in-out infinite}
  .tlspan.partial rect{opacity:.55}
  @keyframes tlpulse{0%,100%{opacity:1}50%{opacity:.55}}
  .tlagent{fill:#cb9bdc;opacity:.75}
  .tlagent.running{animation:tlpulse 1.2s ease-in-out infinite}
  .tlmark line{stroke-width:1.5}
  .tlmark.prompt line{stroke:var(--accent);stroke-dasharray:3 2}
  .tlmark.done line{stroke:var(--ok);opacity:.5}
  .sp.read{background:#5fa8d3} .sp.write{background:#e0b341} .sp.run{background:#7fb069}
  .sp.agent{background:#cb9bdc} .sp.mcp{background:#5fb3b3} .sp.net{background:#d97757}
  .sp.etc{background:#8a8074}
  /* 턴 목록 */
  .turns{margin-top:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    overflow:hidden}
  .turnh{padding:10px 13px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:650}
  .turn{padding:8px 13px;border-bottom:1px solid #221f1b}
  .turn:last-child{border-bottom:none}
  .turn.live{background:#1e1b16}
  .tq{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tm{color:var(--dim2);font-size:11px;margin-top:2px}
  .tm .bad{color:var(--bad)}

  /* ---------------- 구성 편집 ---------------- */
  .cfgbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}
  .cfgwarn{color:var(--busy);font-size:11.5px}
  .cfgwarn code{font-family:Consolas,monospace;font-size:10.5px}
  .cfgsel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--fg);
    padding:3px 7px;font:inherit;font-size:11.5px;outline:none;max-width:220px}
  .cfgsel:focus{border-color:var(--accent)}
  .xdel{background:none;border:none;color:var(--dim2);cursor:pointer;font-size:11px;
    padding:0 3px;margin-left:5px;line-height:1;border-radius:3px}
  .xdel:hover{color:var(--bad);background:var(--panel3)}
  .addrow{display:flex;gap:6px;margin-top:9px}
  .addrow .hfilter{margin:0}
  .mform{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
  .mform .hfilter{margin:0;width:auto;flex:1;min-width:150px}
  .mform .hfilter.wide{flex:2.4;min-width:240px}
  .mh{font-size:10px;border-radius:10px;padding:1px 7px;font-weight:600}
  .mh.ok{color:var(--ok);background:#1b2a17} .mh.auth{color:var(--busy);background:#2a2413}
  .mh.fail{color:var(--bad);background:#2a1614} .mh.unk{color:var(--dim2);background:var(--panel3)}
  .chip.own{border-color:var(--line2)}
  /* 설정 대상(스코프) 선택 */
  .scopebar{background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 0 0;
    border-bottom:none;padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}
  .scopebar .lb{color:var(--dim2);font-size:11px}
  .scopenote{background:var(--panel);border:1px solid var(--line);border-top:none;
    border-radius:0 0 10px 10px;padding:7px 12px;margin-bottom:12px;font-size:11px;line-height:1.7}
  .scst{font-size:10px;border-radius:10px;padding:1px 7px;margin-left:5px}
  .scst.has{color:var(--ok);background:#1b2a17}
  .scst.none{color:var(--dim2);background:var(--panel3)}
  /* 시각 설정 편집기 */
  .cfggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;margin-top:9px}
  .cfgfield{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .cfgfield.set{border-color:var(--line2);background:var(--panel3)}
  .cfgfield .fl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
  .cfgfield .fname{font-weight:650;font-size:12.5px}
  .cfgfield .fkey{font-family:Consolas,monospace;font-size:10px;color:var(--dim2);margin-left:auto}
  .cfgfield .fc{display:flex;gap:6px;align-items:center}
  .cfgfield .fhint{color:var(--dim2);font-size:10.5px;margin-top:6px;line-height:1.6}
  .cfgfield .fwarn{color:var(--busy);font-size:10.5px;margin-top:5px;line-height:1.6}
  .cfgfield .fval{font-family:Consolas,monospace;font-size:12px;color:var(--accent2)}
  .cfgfield .fval i{color:var(--dim2);font-style:normal}
  .fromtag{font-size:10px;border-radius:10px;padding:1px 7px;background:var(--panel3);color:var(--dim2)}
  .fromtag.mine{background:#2a2413;color:var(--busy)}
  .fromtag.none{opacity:.6}
  .seg.tiny button{padding:3px 8px;font-size:11px}
  .cfgnum,.cfgtext{background:var(--bg);border:1px solid var(--line);border-radius:6px;
    color:var(--fg);padding:4px 8px;font:inherit;font-size:12px;outline:none;width:100%}
  .cfgnum{width:110px}
  .cfgnum:focus,.cfgtext:focus{border-color:var(--accent)}
  /* 문서 편집 모달 */
  #docmodal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;padding:26px}
  .dmbox{background:var(--panel);border:1px solid var(--line2);border-radius:12px;
    width:min(920px,100%);height:min(78vh,760px);display:flex;flex-direction:column;
    box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .dmh{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;
    align-items:center;flex-wrap:wrap;font-size:13px}
  .dmh .dimtxt{font-family:Consolas,monospace;font-size:10.5px}
  .dmta{flex:1;background:var(--bg);border:none;border-bottom:1px solid var(--line);
    color:var(--fg);font-family:Consolas,"D2Coding",monospace;font-size:12.5px;line-height:1.6;
    padding:13px 15px;resize:none;outline:none}
  .dmf{padding:8px 14px}

  /* ---------------- 연결 그래프 탭 ---------------- */
  #graphwrap{padding:14px 20px 70px}
  .mband{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 13px;margin-bottom:11px}
  .mbl{display:block;color:var(--dim2);font-size:11px;margin-bottom:7px}
  .glegend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--dim2);
    font-size:11.5px;margin-bottom:8px}
  .glegend i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:0}
  .glegend .gl2{color:var(--dim2);opacity:.8}
  .gwrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
  .gsvg{display:block}
  .gsvg text{font:12px "Pretendard","Malgun Gothic",system-ui,sans-serif;fill:var(--fg)}
  .gsvg text.gcol{font-size:11px;fill:var(--dim2);font-weight:650;letter-spacing:.3px}
  .gsvg text.gsub{font-size:10.5px;fill:var(--dim2)}
  .gsvg .gn rect{fill:var(--panel2);stroke:var(--line);stroke-width:1}
  .gsvg .gn:hover rect{stroke:var(--accent)}
  .gsvg .gn.proj rect{fill:var(--panel3)}
  .gsvg .gn.sess{cursor:pointer}
  .gsvg .gn.sess.live rect{stroke:#6b5620;fill:#241f16}
  .gsvg .gn.sess.emb rect{stroke:#2c4a5c}
  .gsvg .gn.agent rect{fill:#17242b;stroke:#2c4a5c}
  .gsvg .dlive{fill:var(--idle)} .gsvg .dbusy{fill:var(--busy)} .gsvg .doff{fill:var(--dim2)}
  .gsvg .dwait{fill:var(--accent)}
  .gsvg .gn.working rect{stroke:var(--busy);fill:#241f16}
  .gsvg .gn.working circle{animation:pulse 1.1s infinite}
  /* 활동 중인 세션의 엣지는 점선이 계속 흐른다 */
  .gsvg .gedge.flowing{stroke-dasharray:5 4;animation:dashflow .8s linear infinite;opacity:1}
  @keyframes dashflow{to{stroke-dashoffset:-18}}
  /* 이벤트가 올 때 엣지를 따라 달리는 신호 */
  .gsvg .gpulse circle{fill:var(--accent2);filter:drop-shadow(0 0 4px rgba(232,155,127,.85))}
  .gsvg .gpulse.p-prompt circle{fill:var(--accent);filter:drop-shadow(0 0 5px rgba(217,119,87,.95))}
  .gsvg .gpulse.p-agent  circle{fill:#cb9bdc;filter:drop-shadow(0 0 5px rgba(203,155,220,.95))}
  .gsvg .gpulse.p-read   circle{fill:var(--idle);filter:drop-shadow(0 0 4px rgba(95,168,211,.85))}
  .gsvg .gpulse.p-write  circle{fill:var(--busy);filter:drop-shadow(0 0 4px rgba(224,179,65,.85))}
  .gsvg .gpulse.p-run    circle{fill:var(--ok);filter:drop-shadow(0 0 4px rgba(127,176,105,.85))}
  .gsvg .gpulse.p-mcp    circle{fill:#5fb3b3;filter:drop-shadow(0 0 4px rgba(95,179,179,.85))}
  .gsvg .gpulse.p-fail   circle{fill:var(--bad);filter:drop-shadow(0 0 5px rgba(192,85,74,.95))}
  .gsvg .gpulse.p-wait   circle{fill:var(--accent);filter:drop-shadow(0 0 6px rgba(217,119,87,1))}
  .dbusy{background:var(--busy)} .dlive{background:var(--idle)} .doff{background:var(--dim2)}
  .st.wait{background:var(--accent);box-shadow:0 0 0 3px rgba(217,119,87,.18)}

  /* 실시간 관측 배너 */
  .hookbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;margin-bottom:11px;display:grid;gap:8px;
    grid-template-columns:1fr auto;align-items:center;font-size:12.5px}
  .hookbar.off{border-color:#5c4a1c}
  .hookbar.on{border-color:#2c4a5c}
  .hookbar .hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-self:end}
  .hookbar .hnote{grid-column:1/-1;color:var(--dim2);font-size:11px;line-height:1.7;
    border-top:1px solid var(--line);padding-top:8px}
  .hookbar .hnote code{font-family:Consolas,monospace;color:var(--accent2);font-size:10.5px}
  .hookbar .st{display:inline-block;margin:0 7px 0 0;vertical-align:0}

  /* 그래프 + 피드 2단 */
  .gsplit{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:11px;align-items:start}
  @media (max-width:1100px){ .gsplit{grid-template-columns:1fr} }
  .gfeed{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;max-height:min(74vh,760px);overflow:hidden}
  .gfh{padding:10px 13px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:650;
    display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .gfc{color:var(--ok);font-size:10.5px;font-weight:400}
  .gfa{background:var(--panel3);color:var(--busy);border-radius:10px;padding:1px 8px;
    font-size:10.5px;font-weight:600}
  .gfl{overflow-y:auto;padding:4px 0}
  .feedempty{color:var(--dim2);text-align:center;padding:34px 16px;font-size:12px;line-height:1.9}
  .fe{display:grid;grid-template-columns:52px 66px 1fr;gap:7px;align-items:baseline;
    padding:5px 11px;border-bottom:1px solid #221f1b;font-size:11.5px}
  .fe:hover{background:var(--panel2)}
  .fe .ft{color:var(--dim2);font-family:Consolas,monospace;font-size:10.5px}
  .fe .fk{font-size:10.5px;font-weight:650;white-space:nowrap}
  .fe .fb{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fe .fb b{color:var(--fg);font-weight:600}
  .fe .fp{grid-column:3;color:var(--dim2);font-size:10px}
  .fe.e-user  .fk{color:var(--accent2)}
  .fe.e-tool  .fk{color:var(--idle)}
  .fe.e-tool2 .fk{color:var(--dim2)}
  .fe.e-agent .fk{color:#cb9bdc}
  .fe.e-agent2 .fk{color:#8f6fa0}
  .fe.e-life  .fk{color:var(--ok)}
  .fe.e-fail  .fk{color:var(--bad)}
  .fe.e-note  .fk{color:var(--busy)}

  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);z-index:60;
    background:var(--panel3);border:1px solid var(--accent);border-radius:10px;padding:10px 18px;
    transition:transform .18s ease;box-shadow:0 10px 34px rgba(0,0,0,.55);max-width:80vw;font-size:13px}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:var(--bad)}
  .empty{color:var(--dim);text-align:center;padding:70px 20px;grid-column:1/-1;line-height:1.9}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;font-size:11px;font-family:Consolas,monospace;color:var(--dim)}
  @media (max-width:520px){ .grid{grid-template-columns:1fr} }
</style>

<body>
<header>
  <div class="row">
    <h1><span class="dot"></span>Claude Code 세션 런처</h1>
    <input id="q" placeholder="프로젝트 · 경로 · 세션 제목 · 대화 내용 검색   ( / 로 포커스 )" autocomplete="off">
    <div class="seg" title="세션을 어디서 열지 - 모든 실행 버튼에 적용됩니다">
      <button id="m-emb" data-mode="embed">대시보드</button>
      <button id="m-ext" data-mode="window">새 창</button>
    </div>
    <span id="tok" class="tokbar" hidden></span>
    <button class="btn ghost" id="layout" title="한 줄에 하나씩 넓게 보기">넓게</button>
    <button class="btn ghost" id="refresh" title="다시 스캔">&#8635;</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="all">전체<span class="n" id="n-all">0</span></button>
    <button class="tab" data-tab="fav">즐겨찾기<span class="n" id="n-fav">0</span></button>
    <button class="tab" data-tab="live">실행 중<span class="n" id="n-live">0</span></button>
    <button class="tab" data-tab="term">터미널<span class="n" id="n-term">0</span></button>
    <button class="tab" data-tab="flow">실황<span class="n" id="n-flow" hidden></span></button>
    <button class="tab" data-tab="graph">연결<span class="n" id="n-graph" hidden></span></button>
    <button class="tab" data-tab="cfg">구성<span class="n" id="n-cfg">0</span></button>
  </div>
  <div class="meta" id="env"></div>
</header>

<main id="main">
  <div class="grid" id="list"><div class="empty">불러오는 중&#8230;</div></div>
  <div id="termwrap" hidden>
    <div class="termbar" id="termbar"></div>
    <div class="termhost" id="termhost"></div>
    <div class="termempty" id="termempty">
      <div>대시보드 안에서 도는 터미널이 없습니다.</div>
      <div>실행 위치를 <b>대시보드</b>로 두고 <b>전체</b> 탭에서 <b>이어하기</b>를 누르면 여기에 열립니다.<br>
      브라우저를 닫거나 새로고침해도 세션은 계속 살아 있습니다.</div>
    </div>
  </div>
  <div id="tlwrapouter" hidden></div>
  <div id="graphwrap" hidden></div>
  <div id="cfgwrap" hidden></div>
</main>

<div id="scrim"></div>
<aside id="panel">
  <div class="ph">
    <div class="grow">
      <div class="pt" id="p-title">&#8212;</div>
      <div class="ps" id="p-sub"></div>
    </div>
    <button class="icon" id="p-close" title="닫기 (Esc)">&#10005;</button>
  </div>
  <div class="pa">
    <button class="btn primary xs" id="p-resume">이어하기</button>
    <button class="btn live xs" id="p-goterm" hidden>터미널로 이동</button>
    <button class="btn xs" id="p-focus" hidden>실행 중인 창 띄우기</button>
    <button class="btn xs" id="p-fav">&#9734; 즐겨찾기</button>
    <div class="grow"></div>
    <button class="btn ghost xs" id="p-more">더 불러오기</button>
    <span class="ps" id="p-info"></span>
  </div>
  <div id="log"></div>
</aside>

<div id="docmodal" hidden></div>
<div id="toast"></div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-web-links.js"></script>
<script src="/md.js"></script>
<script src="/term.js"></script>
<script src="/live.js"></script>
<script src="/config-edit.js"></script>
<script src="/timeline.js"></script>
<script src="/harness-ui.js"></script>
<script>
const $ = s => document.querySelector(s);
let DATA = [], ENV = {}, TERMS = [];
let TAB  = localStorage.getItem('ccl.tab')  || 'all';
let MODE = localStorage.getItem('ccl.mode') || 'embed';   // embed | window
let WIDE = localStorage.getItem('ccl.wide') === '1';
const expanded = new Set();
let openSess = null, openLimit = 40, transTimer = null;

/* ---------------------------------------------------------- 유틸 */
function ago(ms){
  const m = Math.floor((Date.now()-ms)/60000);
  if (m < 1) return '방금';
  if (m < 60) return m+'분 전';
  const h = Math.floor(m/60);  if (h < 24) return h+'시간 전';
  const d = Math.floor(h/24);  if (d < 7)  return d+'일 전';
  if (d < 60) return Math.floor(d/7)+'주 전';
  return Math.floor(d/30)+'개월 전';
}
function stamp(ms){
  const d = new Date(ms), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
const esc = window.escHtml;
function statusLabel(l){ return !l ? '' : (l.status === 'busy' ? '작업 중' : '대기 중'); }

async function post(p, body){
  const r = await fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({error:'응답 오류'}));
  if (!r.ok || j.error) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
let toastTimer;
function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.className=''; }, 3000);
}

/* 내장 터미널이 물고 있는 세션 ID -> 터미널 정보 */
function embeddedBySession(){
  const m = new Map();
  for (const t of TERMS) if (t.sessionId && t.alive) m.set(t.sessionId, t);
  return m;
}

/* ---------------------------------------------------------- 토큰 사용량 */
// 출처는 세션 기록의 assistant 라인 message.usage.
// 같은 응답이 스트리밍·재개로 여러 번 기록되므로 서버에서 id 별 최대값만 남긴다.
let TOK = null;

function tk(n){
  if (n == null) return '-';
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(n >= 1e5 ? 0 : 1) + 'k';
  return String(n);
}

async function loadTokens(){
  try{
    TOK = await (await fetch('/api/tokens',{cache:'no-store'})).json();
  }catch{ return; }
  renderTokens();
}

function renderTokens(){
  const el = $('#tok');
  if (!TOK || TOK.error){ el.hidden = true; return; }
  const t = TOK.today, w = TOK.win5h;
  el.hidden = false;
  el.innerHTML =
      '<div class="tk"><span class="tl">오늘</span><span class="tv">' + tk(t.total) + '</span></div>'
    + '<div class="tk now"><span class="tl">최근 5시간</span><span class="tv">' + tk(w.total) + '</span></div>'
    + '<div class="tk sub"><span class="tl">출력 · 입력</span><span class="tv">'
    +   tk(t.output) + ' · ' + tk(t.input) + '</span></div>';

  const lines = [
    '토큰 사용량 (세션 기록의 usage 합계)',
    '',
    '[ 오늘 ' + new Date(TOK.dayStart).toLocaleDateString('ko-KR') + ' ]',
    '  합계        ' + t.total.toLocaleString(),
    '  입력        ' + t.input.toLocaleString(),
    '  출력        ' + t.output.toLocaleString() + (t.thinking ? '  (사고 ' + t.thinking.toLocaleString() + ')' : ''),
    '  캐시 쓰기    ' + t.cacheWrite.toLocaleString()
      + (t.cache1h || t.cache5m ? '  (1시간 ' + tk(t.cache1h) + ' · 5분 ' + tk(t.cache5m) + ')' : ''),
    '  캐시 읽기    ' + t.cacheRead.toLocaleString(),
    '  응답 수      ' + t.calls.toLocaleString(),
    '',
    '[ 최근 5시간 ] 합계 ' + w.total.toLocaleString() + ' · 응답 ' + w.calls.toLocaleString(),
  ];
  if (TOK.models.length){
    lines.push('', '[ 모델별 (오늘) ]');
    for (const m of TOK.models) lines.push('  ' + m.model.padEnd(20) + tk(m.total) + '  (' + m.calls + '회)');
  }
  if (TOK.sessions.length){
    lines.push('', '[ 프로젝트별 (오늘) ]');
    for (const sx of TOK.sessions.slice(0,6)){
      const nm = String(sx.cwd || '').split(/[\\/]/).filter(Boolean).pop() || sx.sessionId.slice(0,8);
      lines.push('  ' + nm.padEnd(24) + tk(sx.total));
    }
  }
  lines.push('', '캐시 읽기가 대부분인 것은 정상입니다 (대화가 길어질수록 늘어납니다).',
             '스캔: 파일 ' + TOK.scanned.files + '개 · ' + TOK.scanned.ms + 'ms');
  el.title = lines.join('\n');
}

/* ---------------------------------------------------------- 데이터 */
async function load(){
  const j = await (await fetch('/api/projects',{cache:'no-store'})).json();
  DATA = j.projects; ENV = j.env;
  await loadTerms();
}

async function loadTerms(){
  try{
    const j = await (await fetch('/api/terms',{cache:'no-store'})).json();
    TERMS = j.terms || [];
    CC.term.sync(TERMS);
  }catch(e){}
  renderCounts(); renderTermBar(); render();
}

// 실행 상태만 가볍게 갱신
async function pollLive(){
  try{
    const j = await (await fetch('/api/live',{cache:'no-store'})).json();
    let changed = false;
    for (const p of DATA) for (const s of p.sessions){
      const n = j.live[s.id] || null;
      const a = s.live ? s.live.status+s.live.pid : '';
      const b = n ? n.status+n.pid : '';
      if (a !== b){ s.live = n; changed = true; }
    }
    if (changed){
      for (const p of DATA){
        p.liveCount = p.sessions.filter(s=>s.live).length;
        p.busyCount = p.sessions.filter(s=>s.live && s.live.status==='busy').length;
      }
      renderCounts(); render();
      if (openSess) syncPanelHeader();
    }
  }catch(e){}
}

function allSessions(){
  const out = [];
  for (const p of DATA) for (const s of p.sessions) out.push(Object.assign({}, s, {project:p}));
  return out;
}
function renderCounts(){
  const all = allSessions();
  const liveN = all.filter(s=>s.live).length;
  const termN = TERMS.filter(t=>t.alive).length;
  $('#n-all').textContent  = DATA.length;
  $('#n-fav').textContent  = all.filter(s=>s.fav).length;
  $('#n-live').textContent = liveN;
  $('#n-term').textContent = termN;
  $('#env').innerHTML =
    '세션 <b>'+all.length+'</b>개 · 실행 중 <b>'+liveN+'</b>개 · 대시보드 터미널 <b>'+termN+'</b>개'
    + ' &nbsp;|&nbsp; 실행 위치: <b>'+(MODE==='embed'?'대시보드':'새 터미널 창')+'</b>'
    + ' &nbsp;|&nbsp; <kbd>/</kbd> 검색 <kbd>Enter</kbd> 첫 세션 열기 <kbd>Esc</kbd> 닫기';
  $('#m-emb').classList.toggle('on', MODE==='embed');
  $('#m-ext').classList.toggle('on', MODE==='window');
}

/* ---------------------------------------------------------- 실행 */
async function launch(action, cwd, sessionId, title){
  if (MODE === 'embed'){
    await CC.term.open({action:action, cwd:cwd, sessionId:sessionId, title:title});
    setTab('term');
    await loadTerms();
    toast('대시보드 터미널에서 실행했습니다');
  } else {
    await post('/api/launch', {action:action, cwd:cwd, sessionId:sessionId});
    toast('새 터미널 창에서 실행했습니다');
  }
  setTimeout(pollLive, 2500);
}

/* ---------------------------------------------------------- 렌더 */
function terms(){ return $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function hit(p, s, ts){
  if (!ts.length) return true;
  const h = (p.name+' '+p.cwd+' '+(s.title||'')+' '+(s.firstPrompt||'')+' '+(s.last||'')).toLowerCase();
  return ts.every(t => h.includes(t));
}

// 세션 상태에 맞는 주 버튼 하나
function liveBtn(p, s, emb){
  const e = emb.get(s.id);
  if (e) return '<button class="btn live xs" data-goterm="'+esc(e.id)+'">터미널로 이동 · '+esc(statusLabel(s.live)||'대기 중')+'</button>';
  if (s.live) return '<button class="btn live xs" data-focus="'+s.live.pid+'">창 띄우기 · '+esc(statusLabel(s.live))+'</button>';
  return '<button class="btn primary xs" data-act="resume" data-cwd="'+esc(p.cwd)+'" data-sid="'+esc(s.id)+'" data-title="'+esc(s.title||'')+'">이어하기</button>';
}

function sessionRow(p, s, emb){
  const sel = openSess && openSess.id === s.id ? ' sel' : '';
  const e = emb.get(s.id);
  return '<div class="s'+sel+'" data-view="'+esc(s.slug)+'|'+esc(s.id)+'">'
    + '<div class="sl1">'
    +   '<span class="st '+(s.live ? s.live.status : '')+'" title="'+esc(statusLabel(s.live) || '실행 중 아님')+'"></span>'
    +   '<span class="stitle" title="'+esc(s.title||'')+'">'+esc(s.title || '(제목 없음)')+'</span>'
    +   (e ? '<span class="tag emb">대시보드</span>' : '')
    +   '<span class="swhen" title="'+stamp(s.mtime)+'">'+ago(s.mtime)+'</span>'
    +   '<button class="icon '+(s.fav?'on':'')+'" data-fav="'+esc(s.slug)+'|'+esc(s.id)+'" title="즐겨찾기">'+(s.fav?'★':'☆')+'</button>'
    + '</div>'
    + (s.last && s.last !== s.title ? '<div class="slast" title="'+esc(s.last)+'">'+esc(s.last)+'</div>' : '')
    + '<div class="sacts">'
    +   liveBtn(p, s, emb)
    +   '<button class="btn xs" data-act="fork" data-cwd="'+esc(p.cwd)+'" data-sid="'+esc(s.id)+'" data-title="'+esc(s.title||'')+'" title="복제해서 새 세션 ID로 시작">포크</button>'
    +   '<button class="btn ghost xs" data-view="'+esc(s.slug)+'|'+esc(s.id)+'">대화 보기</button>'
    + '</div></div>';
}

function projectCard(p, ss, emb){
  const openAll = expanded.has(p.key) || terms().length > 0;
  const vis = openAll ? ss : ss.slice(0, 3);
  const st = p.busyCount ? 'busy' : (p.liveCount ? 'idle' : '');
  const embN = ss.filter(s => emb.has(s.id)).length;
  return '<section class="card '+(p.exists?'':'missing')+' '+(p.busyCount?'hasbusy':'')+'">'
    + '<div class="chead">'
    +   '<span class="st '+st+'" title="'+(p.busyCount?'작업 중':(p.liveCount?'대기 중':'실행 중 아님'))+'"></span>'
    +   '<div class="grow">'
    +     '<div class="cname" title="'+esc(p.name)+'">'+esc(p.name)+'</div>'
    +     '<div class="cpath" title="'+esc(p.cwd)+'">'+esc(p.cwd)+'</div>'
    +     '<div class="ctags">'
    +       (p.gitBranch ? '<span class="tag br">⎇ '+esc(p.gitBranch)+'</span>' : '')
    +       '<span class="tag">세션 '+p.sessions.length+'</span>'
    +       (p.liveCount ? '<span class="tag run">● 실행 중 '+p.liveCount+'</span>' : '')
    +       (embN ? '<span class="tag emb">대시보드 '+embN+'</span>' : '')
    +       (p.favCount ? '<span class="tag">★ '+p.favCount+'</span>' : '')
    +       (p.exists ? '' : '<span class="tag err">폴더 없음</span>')
    +     '</div>'
    +   '</div>'
    +   '<button class="icon '+(p.pinned?'on':'')+'" data-pin="'+esc(p.key)+'" title="상단 고정">'+(p.pinned?'★':'☆')+'</button>'
    + '</div>'
    + '<div class="slist">'+vis.map(s=>sessionRow(p,s,emb)).join('')+'</div>'
    + ((!openAll && ss.length>3) ? '<div class="more" data-expand="'+esc(p.key)+'">세션 '+(ss.length-3)+'개 더 보기 ▾</div>' : '')
    + '<div class="cfoot">'
    +   '<button class="btn primary xs" data-act="continue" data-cwd="'+esc(p.cwd)+'" data-title="'+esc(p.name)+'" title="claude --continue">최근 이어하기</button>'
    +   '<button class="btn xs" data-act="new" data-cwd="'+esc(p.cwd)+'" data-title="'+esc(p.name)+'" title="claude">새 세션</button>'
    +   '<div class="grow"></div>'
    +   '<button class="btn ghost xs" data-open="folder" data-cwd="'+esc(p.cwd)+'" title="폴더 열기">📁</button>'
    +   '<button class="btn ghost xs" data-open="vscode" data-cwd="'+esc(p.cwd)+'">VS Code</button>'
    + '</div></section>';
}

function sessionCard(s, emb){
  const p = s.project;
  const e = emb.get(s.id);
  return '<section class="card sc '+(s.live&&s.live.status==='busy'?'hasbusy':'')+' '+(p.exists?'':'missing')+'">'
    + '<div class="chead">'
    +   '<span class="st '+(s.live?s.live.status:'')+'" title="'+esc(statusLabel(s.live)||'실행 중 아님')+'"></span>'
    +   '<div class="grow">'
    +     '<div class="proj" title="'+esc(p.cwd)+'">'+esc(p.name)+(p.gitBranch?' · ⎇ '+esc(p.gitBranch):'')+'</div>'
    +     '<div class="cname" title="'+esc(s.title||'')+'">'+esc(s.title||'(제목 없음)')+'</div>'
    +     '<div class="ctags">'
    +       '<span class="tag" title="'+stamp(s.mtime)+'">'+ago(s.mtime)+'</span>'
    +       (s.live ? '<span class="tag run">● '+esc(statusLabel(s.live))+' · PID '+s.live.pid+'</span>' : '')
    +       (e ? '<span class="tag emb">대시보드 터미널</span>' : '')
    +       '<span class="tag">'+s.sizeKB+'KB</span>'
    +       (p.exists ? '' : '<span class="tag err">폴더 없음</span>')
    +     '</div>'
    +   '</div>'
    +   '<button class="icon '+(s.fav?'on':'')+'" data-fav="'+esc(s.slug)+'|'+esc(s.id)+'" title="즐겨찾기">'+(s.fav?'★':'☆')+'</button>'
    + '</div>'
    + '<div class="body"><div class="lastq" data-view="'+esc(s.slug)+'|'+esc(s.id)+'" title="클릭하면 대화 보기">'
    +   esc(s.last||s.title||'')+'</div></div>'
    + '<div class="cfoot">'
    +   liveBtn(p, s, emb)
    +   '<button class="btn xs" data-act="fork" data-cwd="'+esc(p.cwd)+'" data-sid="'+esc(s.id)+'" data-title="'+esc(s.title||'')+'">포크</button>'
    +   '<button class="btn ghost xs" data-view="'+esc(s.slug)+'|'+esc(s.id)+'">대화 보기</button>'
    +   '<div class="grow"></div>'
    +   '<button class="btn ghost xs" data-open="folder" data-cwd="'+esc(p.cwd)+'">📁</button>'
    + '</div></section>';
}

function render(){
  const isTerm  = TAB === 'term';
  const isGraph = TAB === 'graph';
  const isCfg   = TAB === 'cfg';
  const isTl    = TAB === 'flow';
  $('#termwrap').hidden    = !isTerm;
  $('#graphwrap').hidden   = !isGraph;
  $('#cfgwrap').hidden     = !isCfg;
  $('#tlwrapouter').hidden = !isTl;
  $('#list').hidden = isTerm || isGraph || isCfg || isTl;
  $('#main').classList.toggle('termmode', isTerm);
  if (isTl){ CC.timeline.load(true); return; }
  if (isTerm){ CC.term.refit(); return; }
  // 그래프·구성은 폴링(4초)마다 다시 그리면 펼쳐둔 섹션이 닫히고 스크롤이 튄다.
  // 비어 있을 때만 그리고, 갱신은 ↻ 버튼으로 한다.
  if (isGraph){
    if (!$('#graphwrap').firstChild) CC.harness.loadGraph($('#graphwrap'));
    return;
  }
  if (isCfg){
    if (!$('#cfgwrap').firstChild){
      if (CC.harness.config) CC.harness.renderConfig($('#cfgwrap'));
      else CC.harness.loadConfig($('#cfgwrap')).then(updateCfgBadge);
    }
    return;
  }

  const ts = terms();
  const emb = embeddedBySession();
  const list = $('#list');
  list.className = 'grid' + (WIDE ? ' wide' : '');

  if (TAB === 'all'){
    const out = [];
    for (const p of DATA){
      const ss = p.sessions.filter(s => hit(p, s, ts));
      if (ss.length) out.push(projectCard(p, ss, emb));
    }
    list.innerHTML = out.length ? out.join('')
      : '<div class="empty">'+(ts.length?'검색 결과가 없습니다.':'세션이 없습니다.')+'</div>';
    return;
  }

  const pick = TAB === 'fav' ? (s=>s.fav) : (s=>s.live);
  const ss = allSessions().filter(s => pick(s) && hit(s.project, s, ts));
  ss.sort((a,b)=> ((b.live?1:0)-(a.live?1:0)) || (b.mtime-a.mtime));
  list.innerHTML = ss.length ? ss.map(s=>sessionCard(s,emb)).join('')
    : (TAB === 'fav'
      ? '<div class="empty">즐겨찾기한 세션이 없습니다.<br>세션 옆의 <b>☆</b> 를 눌러 자주 쓰는 세션을 등록하세요.</div>'
      : '<div class="empty">지금 실행 중인 세션이 없습니다.</div>');
}

/* ---------------------------------------------------------- 터미널 탭 바 */
// 복사·붙여넣기 도움말 (title 속성에 넣을 여러 줄 문자열)

function renderTermBar(){
  const bar = $('#termbar');
  const cur = CC.term.current;
  const vis = CC.term.visibleIds;
  const lay = CC.term.getLayout();
  // 탭 순서를 패인 순서에 맞춘다. 드래그로 자리를 바꾸면 탭도 같이 움직인다.
  const html = TERMS.slice()
    .sort(function(a,b){ return CC.term.orderOf(a.id) - CC.term.orderOf(b.id); })
    .map(function(t){
    const parts = t.cwd.split(/[\\/]/).filter(Boolean);
    const proj = parts.length ? parts[parts.length-1] : t.cwd;
    const label = t.name || t.title || proj;
    const dot = !t.alive ? '' : (t.status === 'busy' ? 'busy' : 'idle');
    const sub = t.alive ? (t.status ? ' · '+(t.status==='busy'?'작업 중':'대기 중') : '') : ' · 종료됨';
    const onScreen = vis.indexOf(t.id) >= 0;
    return '<div class="tt '+(t.id===cur?'on':'')+' '+(t.alive?'':'dead')+' '+(onScreen?'shown':'')+'"'
      + ' data-goterm="'+esc(t.id)+'" title="'+(onScreen?'화면에 표시 중':'클릭하면 화면으로 가져옵니다')+'">'
      + '<span class="st '+dot+'"></span>'
      + '<span class="lbl">'+esc(label)+'<div class="sub">'+esc(proj)+sub+'</div></span>'
      + '<span class="x" data-closeterm="'+esc(t.id)+'" title="'+(t.alive?'세션 종료':'닫기')+'">✕</span>'
      + '</div>';
  }).join('');
  const ori = CC.term.getOrient();
  const layBtn = (v,txt,tip) => '<button data-lay="'+v+'" class="'+(lay===v?'on':'')+'" title="'+tip+'">'+txt+'</button>';
  const oriBtn = (v,txt,tip) => '<button data-ori="'+v+'" class="'+(ori===v?'on':'')+'" title="'+tip+'">'+txt+'</button>';
  bar.innerHTML = html
    + '<button class="btn xs" id="t-new" style="margin-left:4px">+ 새 터미널</button>'
    + '<div class="lay"><span class="lb">개수</span>'
    +   layBtn(1,'1','한 개만 크게')
    +   layBtn(2,'2','2개')
    +   layBtn(3,'3','3개')
    +   layBtn(4,'4','4개')
    +   layBtn(0,'전체','열린 터미널 전부')
    + '</div>'
    + '<div class="lay"><span class="lb">방향</span>'
    +   oriBtn('cols','가로','좌우로 나란히 - 긴 명령·넓은 출력에 좋다')
    +   oriBtn('rows','세로','위아래로 쌓기 - 대화 흐름을 길게 보기 좋다')
    +   oriBtn('grid','가로세로','정사각형에 가깝게 배치')
    +   '<button data-resetsize="1" title="드래그로 바꾼 패인 크기를 균등하게 되돌린다">크기 초기화</button>'
    + '</div>'
    + '<span class="clip" title="' + CLIP_HELP + '">'
    +   '복사 <kbd>Ctrl+C</kbd> · 붙여넣기 <kbd>Ctrl+V</kbd> · 선택 안 되면 <kbd>Shift+드래그</kbd> ⓘ</span>'
    + '<span class="clip" title="패인 머리글(⠿)을 잡고 다른 패인 위로 끌면 자리가 바뀝니다.&#10;'
    +   '패인 사이 틈을 끌면 크기가 바뀌고, 더블클릭하면 그 줄만 균등해집니다.">'
    +   '자리 <kbd>머리글 드래그</kbd> · 크기 <kbd>경계 드래그</kbd> ⓘ</span>';
  $('#termempty').hidden = TERMS.length > 0;
  $('#termhost').hidden = TERMS.length === 0;
}

/* ---------------------------------------------------------- 대화 패널 */
function findSession(slug, id){
  for (const p of DATA) for (const s of p.sessions)
    if (s.id === id && s.slug === slug) return Object.assign({}, s, {project:p});
  return null;
}
function syncPanelHeader(){
  if (!openSess) return;
  const s = findSession(openSess.slug, openSess.id) || openSess;
  openSess = s;
  const e = embeddedBySession().get(s.id);
  $('#p-title').textContent = s.title || '(제목 없음)';
  $('#p-sub').innerHTML = esc(s.project.name)+' · '+ago(s.mtime)+' · '+s.sizeKB+'KB'
    + (s.live ? ' · <b style="color:var(--busy)">● '+esc(statusLabel(s.live))+' (PID '+s.live.pid+')</b>' : '');
  $('#p-goterm').hidden = !e;
  $('#p-goterm').dataset.goterm = e ? e.id : '';
  $('#p-focus').hidden = !s.live || !!e;
  $('#p-resume').hidden = !!s.live;
  $('#p-fav').innerHTML = (s.fav ? '★' : '☆') + ' 즐겨찾기';
  $('#p-fav').classList.toggle('primary', !!s.fav);
}

async function showSession(slug, id, keepScroll){
  const s = findSession(slug, id);
  if (!s) return;
  if (!openSess || openSess.id !== id) openLimit = 40;
  openSess = s;
  $('#panel').classList.add('show'); $('#scrim').classList.add('show');
  syncPanelHeader(); render();
  await loadTranscript(keepScroll);
  clearInterval(transTimer);
  transTimer = setInterval(function(){ if (openSess && openSess.live) loadTranscript(true); }, 5000);
}

async function loadTranscript(keepScroll){
  if (!openSess) return;
  const log = $('#log');
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  if (!keepScroll) log.innerHTML = '<div class="empty">불러오는 중&#8230;</div>';
  try{
    const r = await fetch('/api/transcript?slug='+encodeURIComponent(openSess.slug)
      +'&id='+encodeURIComponent(openSess.id)+'&limit='+openLimit, {cache:'no-store'});
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    const label = {user:'나', assistant:'Claude', thinking:'생각', tool:'도구'};
    log.innerHTML = j.messages.map(function(m){
      return '<div class="m '+m.role+'"><div class="who">'+(label[m.role]||m.role)
        + (m.ts?'<span class="ts">'+stamp(new Date(m.ts).getTime())+'</span>':'')+'</div>'
        + '<div class="txt">'+((m.role==='tool'||m.role==='thinking') ? esc(m.text) : md(m.text))+'</div></div>';
    }).join('') || '<div class="empty">표시할 대화가 없습니다.</div>';
    $('#p-info').textContent = j.messages.length+'/'+j.total+'개'+(j.truncated?' (앞부분 생략)':'');
    $('#p-more').hidden = j.messages.length >= j.total;
    if (!keepScroll || atBottom) log.scrollTop = log.scrollHeight;
  }catch(e){
    log.innerHTML = '<div class="empty">불러오지 못했습니다: '+esc(e.message)+'</div>';
  }
}
function closePanel(){
  openSess = null; clearInterval(transTimer);
  $('#panel').classList.remove('show'); $('#scrim').classList.remove('show');
  render();
}

/* ---------------------------------------------------------- 탭 */
function setTab(t){
  TAB = t; localStorage.setItem('ccl.tab', TAB);
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === TAB); });
  render();
}

/* ---------------------------------------------------------- 이벤트 */
document.addEventListener('click', async function(e){
  // 구성 편집 컨트롤은 config-edit.js 가 먼저 처리한다
  const ce = e.target.closest('[data-editmode],[data-permdel],[data-dirdel],[data-addfrom],'
    + '[data-plugtoggle],[data-mcpdel],[data-make],[data-docedit],[data-docdel],'
    + '[data-scope],[data-cfgkey],[data-envkey],#m-add,#bakgo,#mcpcheck');
  if (ce && CC.cfgEdit && CC.cfgEdit.handle(ce)) return;

  // 실황 타임라인 컨트롤
  const tl = e.target.closest('[data-tlwin],[data-tlpause]');
  if (tl && CC.timeline && CC.timeline.handle(tl)) return;

  const t = e.target.closest('[data-tab],[data-mode],[data-expand],[data-pin],[data-fav],[data-open],'
    + '[data-act],[data-focus],[data-view],[data-goterm],[data-closeterm],[data-lay],[data-ori],[data-solo],'
    + '[data-reloadterm],[data-restartterm],[data-resetsize],'
    + '[data-openfile],[data-hookinstall],[data-hookuninstall],#t-new,.m.thinking');
  if (!t) return;

  // 실시간 관측 훅 설치 / 제거 (~/.claude/settings.json 을 고친다)
  if (t.dataset.hookinstall){
    const mode = t.dataset.hookinstall;
    t.disabled = true;
    try{
      const j = await CC.live.install(mode);
      toast('훅 ' + j.installed.length + '개 설치됨 · 백업: ' + j.backup.split(/[\\/]/).pop());
      CC.harness.loadGraph($('#graphwrap'));
    }catch(err){ toast('설치 실패: ' + err.message, true); }
    t.disabled = false;
    return;
  }
  if (t.dataset.hookuninstall){
    t.disabled = true;
    try{
      const j = await CC.live.uninstall();
      toast('훅 ' + j.removed + '개 제거됨 · 백업: ' + j.backup.split(/[\\/]/).pop());
      CC.harness.loadGraph($('#graphwrap'));
    }catch(err){ toast('제거 실패: ' + err.message, true); }
    t.disabled = false;
    return;
  }

  if (t.dataset.openfile){
    try{ await post('/api/open',{cwd:t.dataset.openfile, target:'vscode'}); toast('VS Code 로 열었습니다'); }
    catch(err){ toast(err.message, true); }
    return;
  }

  if (t.dataset.lay !== undefined){
    CC.term.setLayout(Number(t.dataset.lay)); renderTermBar(); return;
  }
  if (t.dataset.ori){
    CC.term.setOrient(t.dataset.ori); renderTermBar(); return;
  }
  if (t.dataset.solo){
    e.stopPropagation(); CC.term.solo(t.dataset.solo); renderTermBar(); return;
  }
  if (t.dataset.resetsize){
    CC.term.resetSizes(); toast('패인 크기를 균등하게 되돌렸습니다'); return;
  }
  if (t.dataset.reloadterm){
    e.stopPropagation();
    CC.term.reload(t.dataset.reloadterm);
    toast('화면을 다시 붙였습니다');
    return;
  }
  if (t.dataset.restartterm){
    e.stopPropagation();
    const id = t.dataset.restartterm;
    const inf = TERMS.find(x => x.id === id);
    // 응답을 받고 있는 중이면 그 응답은 사라진다. 물어본다.
    if (inf && inf.alive && inf.status === 'busy'
        && !confirm('작업 중인 세션입니다.\n\n재시작하면 지금 받고 있는 응답이 사라집니다.'
                  + '\n대화 기록은 --resume 으로 이어집니다.\n\n재시작할까요?')) return;
    t.disabled = true;
    try{ await CC.term.restart(id); await loadTerms(); }
    catch(err){ toast('재시작 실패: ' + err.message, true); }
    t.disabled = false;
    return;
  }
  if (t.id === 't-new'){
    const p = DATA[0];
    if (!p) return;
    try{ await CC.term.open({action:'new', cwd:p.cwd, title:p.name}); await loadTerms(); }
    catch(err){ toast(err.message, true); }
    return;
  }
  if (t.dataset.closeterm){
    e.stopPropagation();
    try{ await CC.term.close(t.dataset.closeterm); await loadTerms(); }
    catch(err){ toast(err.message,true); }
    return;
  }
  if (t.dataset.goterm){
    CC.term.show(t.dataset.goterm); setTab('term'); renderTermBar(); return;
  }
  if (t.dataset.tab){ setTab(t.dataset.tab); return; }
  if (t.dataset.mode){
    MODE = t.dataset.mode; localStorage.setItem('ccl.mode', MODE); renderCounts(); return;
  }
  if (t.classList.contains('thinking')){ t.classList.toggle('open'); return; }
  if (t.dataset.expand){ expanded.add(t.dataset.expand); render(); return; }

  if (t.dataset.pin){
    try{ await post('/api/pin',{key:t.dataset.pin}); await load(); }catch(err){ toast(err.message,true); }
    return;
  }
  if (t.dataset.fav){
    const parts = t.dataset.fav.split('|');
    try{
      const j = await post('/api/fav',{slug:parts[0],id:parts[1]});
      for (const p of DATA){
        for (const s of p.sessions) if (s.id===parts[1] && s.slug===parts[0]) s.fav = j.fav;
        p.favCount = p.sessions.filter(x=>x.fav).length;
      }
      renderCounts(); render(); if (openSess) syncPanelHeader();
      toast(j.fav ? '즐겨찾기에 추가' : '즐겨찾기에서 제거');
    }catch(err){ toast(err.message,true); }
    return;
  }
  if (t.dataset.view){
    const parts = t.dataset.view.split('|');
    showSession(parts[0], parts[1]); return;
  }
  if (t.dataset.focus){
    try{ const j = await post('/api/focus',{pid:Number(t.dataset.focus)}); toast(j.info||'창을 띄웠습니다'); }
    catch(err){ toast(err.message,true); }
    return;
  }
  if (t.dataset.open){
    try{ await post('/api/open',{cwd:t.dataset.cwd,target:t.dataset.open}); }
    catch(err){ toast(err.message,true); }
    return;
  }
  if (t.dataset.act){
    t.disabled = true;
    try{ await launch(t.dataset.act, t.dataset.cwd, t.dataset.sid, t.dataset.title); }
    catch(err){ toast(err.message,true); }
    setTimeout(function(){ t.disabled = false; }, 900);
  }
});

$('#p-close').onclick = closePanel;
$('#scrim').onclick = closePanel;
$('#p-more').onclick = function(){ openLimit = Math.min(300, openLimit + 60); loadTranscript(true); };
$('#p-fav').onclick = async function(){
  if (!openSess) return;
  try{
    const j = await post('/api/fav',{slug:openSess.slug,id:openSess.id});
    for (const p of DATA){
      for (const s of p.sessions) if (s.id===openSess.id && s.slug===openSess.slug) s.fav = j.fav;
      p.favCount = p.sessions.filter(x=>x.fav).length;
    }
    renderCounts(); syncPanelHeader(); render();
  }catch(err){ toast(err.message,true); }
};
$('#p-resume').onclick = async function(){
  if (!openSess) return;
  try{ await launch('resume', openSess.project.cwd, openSess.id, openSess.title); closePanel(); }
  catch(err){ toast(err.message,true); }
};
$('#p-goterm').onclick = function(){
  const id = $('#p-goterm').dataset.goterm;
  if (id){ closePanel(); CC.term.show(id); setTab('term'); renderTermBar(); }
};
$('#p-focus').onclick = async function(){
  if (!openSess || !openSess.live) return;
  try{ const j = await post('/api/focus',{pid:openSess.live.pid}); toast(j.info||'창을 띄웠습니다'); }
  catch(err){ toast(err.message,true); }
};
$('#layout').onclick = function(){
  WIDE = !WIDE; localStorage.setItem('ccl.wide', WIDE?'1':'0');
  $('#layout').textContent = WIDE ? '카드' : '넓게'; render();
};
$('#q').addEventListener('input', render);
$('#q').addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ $('#q').value=''; render(); }
  if (e.key === 'Enter'){
    const b = $('#list [data-act="resume"], #list [data-goterm], #list [data-focus]');
    if (b) b.click();
  }
});
// 터미널에 포커스가 있을 때는 전역 단축키가 키를 가로채지 않게 한다
document.addEventListener('keydown', function(e){
  if (e.target.closest && e.target.closest('#termwrap')) return;
  if (e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && openSess) closePanel();
});
// ↻ : 보고 있는 탭에 맞는 것을 다시 읽는다
// 구성 편집의 select 변경
document.addEventListener('change', function(e){
  if (CC.cfgEdit) CC.cfgEdit.handleChange(e.target);
});
// 구성이 바뀌면 다시 읽어 화면을 맞춘다
CC.cfgEdit.onChanged = function(){
  CC.harness.loadConfig($('#cfgwrap')).then(updateCfgBadge);
};
CC.toast = toast;   // config-edit.js 가 쓴다

$('#refresh').onclick = function(){
  if (TAB === 'graph') return CC.harness.loadGraph($('#graphwrap'));
  if (TAB === 'cfg')   return CC.harness.loadConfig($('#cfgwrap')).then(updateCfgBadge);
  return load();
};
function updateCfgBadge(){
  const c = CC.harness.config;
  if (!c) return;
  const warn = c.warnings.filter(function(w){ return w.level === 'warn'; }).length;
  const b = $('#n-cfg');
  b.textContent = warn || c.warnings.length;
  b.style.background = warn ? 'var(--busy)' : '';
  b.style.color = warn ? '#1a1008' : '';
  b.title = warn + ' 주의 / ' + c.warnings.length + ' 건';
}

/* 헤더 높이는 줄바꿈에 따라 달라지므로 실측해서 --hh 에 넣는다.
   고정값을 쓰면 터미널 아래쪽(입력줄·상태줄)이 잘린다. */
function syncHeaderHeight(){
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hh', h + 'px');
  CC.term.refit();
}
window.addEventListener('resize', syncHeaderHeight);
if (window.ResizeObserver) new ResizeObserver(syncHeaderHeight).observe(document.querySelector('header'));

/* ---------------------------------------------------------- 시작 */
CC.term.init($('#termhost'), function(){ renderTermBar(); renderCounts(); });
syncHeaderHeight();

// 실시간 훅 이벤트: 훅 설치 여부와 무관하게 스트림에 붙어 둔다 (설치하면 바로 흐른다)
CC.timeline.init($('#tlwrapouter'));
CC.timeline.start();
CC.live.onUpdate = function(ev){
  CC.harness.onLiveEvent(ev);
  CC.timeline.onEvent();
  // 응답이 끝나면 usage 가 기록되므로 그때 토큰 표시를 갱신한다
  if (ev && (ev.event === 'Stop' || ev.event === 'StopFailure')) setTimeout(loadTokens, 1200);
  const n = CC.live.activeCount();
  const agents = CC.live.agentCount();
  [['#n-graph', n], ['#n-flow', n ? (agents ? n + '·' + agents : n) : '']].forEach(function(p){
    const b = $(p[0]);
    b.textContent = p[1] || '';
    b.hidden = !p[1];
  });
};
CC.live.loadStatus().then(function(){ CC.live.connect(); });
document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === TAB); });
$('#layout').textContent = WIDE ? '카드' : '넓게';
load();
loadTokens();
// 구성은 경고 개수를 탭 뱃지에 띄우기 위해 시작할 때 한 번 읽어둔다
CC.harness.loadConfig($('#cfgwrap')).then(updateCfgBadge);
setInterval(load, 60000);
setInterval(pollLive, 4000);
setInterval(loadTerms, 5000);
setInterval(loadTokens, 20000);   // 변경된 파일만 다시 읽으므로 가볍다
</script>
