/* ---------------------------------------------------------- 대화 패널 */
function findSession(provider, slug, id){
  for (const p of DATA) for (const s of p.sessions)
    if (s.id === id && s.provider === provider) return Object.assign({}, s, {project:p});
  return null;
}
function syncPanelHeader(){
  if (!openSess) return;
  const s = findSession(openSess.provider, openSess.slug, openSess.id) || openSess;
  openSess = s;
  const e = embeddedBySession().get(s.id);
  $('#p-title').textContent = s.title || '(제목 없음)';
  const uSpan = usageSpan(s);
  $('#p-sub').innerHTML = esc(s.project.name)+' · '+ago(s.mtime)+' · '+s.sizeKB+'KB'
    + (s.live ? ' · <b style="color:var('+statusColor(s.live)+')">● '+esc(statusLabel(s.live))+' (PID '+s.live.pid+')</b>' : '')
    + (uSpan ? ' · '+uSpan : '');
  $('#p-goterm').hidden = !e;
  $('#p-goterm').dataset.goterm = e ? e.id : '';
  $('#p-focus').hidden = !s.live || !!e;
  $('#p-resume').hidden = !!s.live;
  $('#p-fav').innerHTML = (s.fav ? '★' : '☆') + ' 즐겨찾기';
  $('#p-fav').classList.toggle('primary', !!s.fav);
}

async function showSession(provider, slug, id, keepScroll){
  const s = findSession(provider, slug, id);
  if (!s) return;
  if (!openSess || openSess.id !== id) openLimit = 40;
  openSess = s;
  $('#panel').classList.add('show'); $('#scrim').classList.add('show');
  syncPanelHeader(); render();
  await loadTranscript(keepScroll);
  clearInterval(transTimer);
  transTimer = setInterval(function(){ if (openSess && openSess.live) loadTranscript(true); }, 5000);
}

async function loadTranscript(keepScroll){
  if (!openSess) return;
  const log = $('#log');
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  if (!keepScroll) log.innerHTML = '<div class="empty">불러오는 중&#8230;</div>';
  try{
    const qs = openSess.provider === 'codex'
      ? 'provider=codex&id='+encodeURIComponent(openSess.id)
      : 'provider=claude&slug='+encodeURIComponent(openSess.slug)+'&id='+encodeURIComponent(openSess.id);
    const r = await fetch('/api/transcript?'+qs+'&limit='+openLimit, {cache:'no-store'});
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    // 어시스턴트 이름은 provider 를 따른다 - Codex 대화를 'Claude' 로 부르면 안 된다
    const label = {user:'나', assistant: openSess.provider === 'codex' ? 'Codex' : 'Claude',
                   thinking:'생각', tool:'도구'};
    log.innerHTML = j.messages.map(function(m){
      return '<div class="m '+m.role+'"><div class="who">'+(label[m.role]||m.role)
        + (m.ts?'<span class="ts">'+stamp(new Date(m.ts).getTime())+'</span>':'')+'</div>'
        + '<div class="txt">'+((m.role==='tool'||m.role==='thinking') ? esc(m.text) : md(m.text))+'</div></div>';
    }).join('') || '<div class="empty">표시할 대화가 없습니다.</div>';
    $('#p-info').textContent = j.messages.length+'/'+j.total+'개'+(j.truncated?' (앞부분 생략)':'');
    $('#p-more').hidden = j.messages.length >= j.total;
    if (!keepScroll || atBottom) log.scrollTop = log.scrollHeight;
  }catch(e){
    log.innerHTML = '<div class="empty">불러오지 못했습니다: '+esc(e.message)+'</div>';
  }
}
function closePanel(){
  openSess = null; clearInterval(transTimer);
  $('#panel').classList.remove('show'); $('#scrim').classList.remove('show');
  render();
}

/* ---------------------------------------------------------- 탭 */
function setTab(t){
  TAB = t; localStorage.setItem('ccl.tab', TAB);
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === TAB); });
  render();
}

/* ------------------------------------------------ 프로젝트 카드 순서 드래그 */
//
// 카드는 render() 가 데이터에서 매번 다시 그리므로, 배열 순서만 바꾸면 화면도 따라온다
// (터미널 패인처럼 CSS order 를 줄 필요가 없다).
document.addEventListener('pointerdown', function(e){
  const grip = e.target.closest && e.target.closest('.pgrip');
  if (!grip || e.button !== 0) return;
  const head = grip.closest('[data-pcard]');
  if (!head) return;

  const fromKey = head.dataset.pcard;
  const sx = e.clientX, sy = e.clientY;
  let moved = false, overKey = null;

  function mark(k){
    if (k === overKey) return;
    const prev = overKey && document.querySelector('[data-pcard="'+CSS.escape(overKey)+'"]');
    if (prev) prev.closest('.card').classList.remove('dropto');
    overKey = k;
    const next = overKey && document.querySelector('[data-pcard="'+CSS.escape(overKey)+'"]');
    if (next) next.closest('.card').classList.add('dropto');
  }
  function move(ev){
    if (!moved){
      if (Math.abs(ev.clientX-sx) + Math.abs(ev.clientY-sy) < 5) return;
      moved = true;
      head.closest('.card').classList.add('drag');
      document.body.classList.add('panedrag');
    }
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const h = el && el.closest ? el.closest('.card') : null;
    const hh = h && h.querySelector('[data-pcard]');
    const k = hh && hh.dataset.pcard !== fromKey ? hh.dataset.pcard : null;
    mark(k);
  }
  function up(){
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    const card = head.closest('.card');
    if (card) card.classList.remove('drag');
    document.body.classList.remove('panedrag');
    const target = overKey;
    mark(null);
    if (moved && target){
      moveProject(fromKey, target);
      toast('순서를 바꿨습니다 · 정렬이 "직접" 으로 전환됩니다');
    }
  }
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});

/* ---------------------------------------------------------- 이벤트 */
document.addEventListener('click', async function(e){
  // 구성 편집 컨트롤은 config-edit.js 가 먼저 처리한다
  const ce = e.target.closest('[data-editmode],[data-permdel],[data-dirdel],[data-addfrom],'
    + '[data-plugtoggle],[data-mcpdel],[data-make],[data-maketeam],[data-teampeek],'
    + '[data-docedit],[data-docdel],'
    + '[data-scope],[data-cfgkey],[data-envkey],#m-add,#bakgo,#mcpcheck');
  if (ce && CC.cfgEdit && CC.cfgEdit.handle(ce)) return;

  // 실황 타임라인 컨트롤
  const tl = e.target.closest('[data-tlwin],[data-tlpause]');
  if (tl && CC.timeline && CC.timeline.handle(tl)) return;

  // 연결 탭 도구 (실행 중만 / 새로고침)
  const gb = e.target.closest('[data-gliveonly],[data-ggraph]');
  if (gb && CC.harness && CC.harness.handleGraphBtn(gb)) return;

  const t = e.target.closest('[data-tab],[data-mode],[data-expand],[data-pin],[data-fav],[data-open],'
    + '[data-act],[data-focus],[data-view],[data-goterm],[data-closeterm],[data-lay],[data-ori],[data-solo],'
    + '[data-reloadterm],[data-restartterm],[data-resetsize],[data-movepane],'
    + '[data-fold],[data-listview],[data-sort],[data-pick],'
    + '[data-hide],[data-hideproj],[data-delsess],[data-showhidden],[data-unhideall],'
    + '[data-mdpick],[data-mdreload],'
    + '[data-openfile],[data-hookinstall],[data-hookuninstall],#t-new,.m.thinking');
  if (!t) return;

  // 실시간 관측 훅 설치 / 제거 (~/.claude/settings.json 또는 ~/.codex/hooks.json 을 고친다)
  if (t.dataset.hookinstall){
    const mode = t.dataset.hookinstall;
    const provider = t.dataset.provider;
    const who = provider === 'codex' ? 'Codex ' : '';
    t.disabled = true;
    try{
      const j = await CC.live.install(mode, provider);
      toast(who + '훅 ' + j.installed.length + '개 설치됨' + backupNote(j.backup));
      CC.harness.loadGraph($('#graphwrap'));
    }catch(err){ toast('설치 실패: ' + err.message, true); }
    t.disabled = false;
    return;
  }
  if (t.dataset.hookuninstall){
    const provider = t.dataset.provider;
    const who = provider === 'codex' ? 'Codex ' : '';
    t.disabled = true;
    try{
      const j = await CC.live.uninstall(provider);
      const n = Array.isArray(j.removed) ? j.removed.length : j.removed;
      toast(who + '훅 ' + n + '개 제거됨' + backupNote(j.backup));
      CC.harness.loadGraph($('#graphwrap'));
    }catch(err){ toast('제거 실패: ' + err.message, true); }
    t.disabled = false;
    return;
  }

  if (t.dataset.openfile){
    try{ await post('/api/open',{cwd:t.dataset.openfile, target:'vscode'}); toast('VS Code 로 열었습니다'); }
    catch(err){ toast(err.message, true); }
    return;
  }

  // ---- 문서 탭 ----
  if (t.dataset.mdpick){
    t.disabled = true;
    const was = t.textContent;
    t.textContent = '폴더 고르는 중…';
    try{
      const j = await post('/api/pickfolder', { start: (MDSTATE && MDSTATE.vault) || '' });
      if (!j.cancelled && j.path){
        await mdSetVault(j.path);
        toast('보관 폴더: ' + j.path.split(/[\\/]/).filter(Boolean).pop());
      }
    }catch(err){ toast('폴더 열기 실패: ' + err.message, true); }
    t.disabled = false; t.textContent = was;
    return;
  }
  if (t.dataset.mdreload){
    if (mdLoaded) $('#mdframe').contentWindow.location.reload();
    toast('편집기를 다시 불러왔습니다');
    return;
  }

  // ---- 폴더 지정해서 실행 ----
  if (t.dataset.pick){
    const provider = t.dataset.pick;
    const label = provider === 'codex' ? 'Codex' : 'Claude';
    t.disabled = true;
    const was = t.textContent;
    t.textContent = '폴더 고르는 중…';
    try{
      // 윈도 기본 폴더 창이 뜬다. 마지막에 고른 곳에서 시작한다.
      const j = await post('/api/pickfolder', { start: localStorage.getItem('ccl.lastpick') || '' });
      if (!j.cancelled && j.path){
        localStorage.setItem('ccl.lastpick', j.path);
        const name = j.path.split(/[\\/]/).filter(Boolean).pop() || j.path;
        await launch('new', j.path, null, name, provider);
        toast((j.known ? '' : '새 폴더 · ') + name + ' 에서 ' + label + ' 새 세션을 시작했습니다');
      }
    }catch(err){ toast('폴더 실행 실패: ' + err.message, true); }
    t.disabled = false;
    t.textContent = was;
    return;
  }

  // ---- 세션 숨기기 / 삭제 ----
  if (t.dataset.hide){
    e.stopPropagation();
    const [provider, slug, id] = t.dataset.hide.split('|');
    try{
      const j = await post('/api/hide', { provider, slug, id });
      toast(j.on ? '숨겼습니다 · 도구 막대의 "숨김"에서 다시 볼 수 있습니다' : '다시 보이게 했습니다');
      await load();
    }catch(err){ toast('실패: ' + err.message, true); }
    return;
  }
  if (t.dataset.hideproj){
    e.stopPropagation();
    try{
      const j = await post('/api/hide', { project: t.dataset.hideproj });
      toast(j.on ? '프로젝트를 숨겼습니다 · 실행 중인 세션이 있으면 계속 보입니다'
                 : '다시 보이게 했습니다');
      await load();
    }catch(err){ toast('실패: ' + err.message, true); }
    return;
  }
  if (t.dataset.showhidden !== undefined){
    SHOWHIDDEN = !SHOWHIDDEN;
    localStorage.setItem('ccl.showhidden', SHOWHIDDEN ? '1' : '0');
    render();
    return;
  }
  if (t.dataset.unhideall !== undefined){
    try{ await post('/api/hide', { clear: true }); toast('숨김을 모두 해제했습니다'); await load(); }
    catch(err){ toast('실패: ' + err.message, true); }
    return;
  }
  if (t.dataset.delsess){
    e.stopPropagation();
    const [provider, slug, id] = t.dataset.delsess.split('|');
    const s = allSessions().find(x => x.id === id);
    const name = (s && (s.title || s.last)) || id;
    if (!confirm('이 세션 기록을 삭제할까요?\n\n' + name.slice(0, 80)
               + '\n\n지우지 않고 휴지통으로 옮깁니다:\n'
               + '~/.claude/.cc-launcher-trash\n\n삭제할까요?')) return;
    t.disabled = true;
    try{
      const j = await post('/api/session/delete', { provider, slug, id });
      if (j.failed && j.failed.length) toast('삭제 실패: ' + j.failed[0].error, true);
      else toast('휴지통으로 옮겼습니다');
      await load();
    }catch(err){ toast('삭제 실패: ' + err.message, true); }
    return;
  }

  // ---- 목록 접기 / 보기 방식 / 정렬 ----
  if (t.dataset.fold !== undefined){
    e.stopPropagation();                  // 카드 클릭(대화 보기)으로 번지지 않게
    const k = t.dataset.fold;
    if (k === 'all')       cardKeys().forEach(x => collapsed.add(x));
    else if (k === 'none') allFoldKeys().forEach(x => collapsed.delete(x));
    else if (collapsed.has(k)) collapsed.delete(k);
    else collapsed.add(k);
    saveCollapsed();
    render();
    return;
  }
  if (t.dataset.listview){
    VIEW = t.dataset.listview; localStorage.setItem('ccl.view', VIEW); render(); return;
  }
  if (t.dataset.sort){
    SORT = t.dataset.sort; localStorage.setItem('ccl.sort', SORT); render(); return;
  }

  if (t.dataset.lay !== undefined){
    CC.term.setLayout(Number(t.dataset.lay)); renderTermBar(); return;
  }
  if (t.dataset.ori){
    CC.term.setOrient(t.dataset.ori); renderTermBar(); return;
  }
  if (t.dataset.solo){
    e.stopPropagation(); CC.term.solo(t.dataset.solo); renderTermBar(); return;
  }
  if (t.dataset.movepane){
    e.stopPropagation();
    CC.term.nudge(t.dataset.movepane, Number(t.dataset.dir) || 0);
    renderTermBar();
    return;
  }
  if (t.dataset.resetsize){
    CC.term.resetSizes(); toast('패인 크기를 균등하게 되돌렸습니다'); return;
  }
  if (t.dataset.reloadterm){
    e.stopPropagation();
    CC.term.reload(t.dataset.reloadterm);
    toast('화면을 다시 붙였습니다');
    return;
  }
  if (t.dataset.restartterm){
    e.stopPropagation();
    const id = t.dataset.restartterm;
    const inf = TERMS.find(x => x.id === id);
    // 응답을 받고 있는 중이면 그 응답은 사라진다. 물어본다.
    if (inf && inf.alive && inf.status === 'busy'
        && !confirm('작업 중인 세션입니다.\n\n재시작하면 지금 받고 있는 응답이 사라집니다.'
                  + '\n대화 기록은 --resume 으로 이어집니다.\n\n재시작할까요?')) return;
    t.disabled = true;
    try{ await CC.term.restart(id); await loadTerms(); }
    catch(err){ toast('재시작 실패: ' + err.message, true); }
    t.disabled = false;
    return;
  }
  if (t.id === 't-new'){
    const p = DATA[0];
    if (!p) return;
    try{ await CC.term.open({action:'new', cwd:p.cwd, title:p.name}); await loadTerms(); }
    catch(err){ toast(err.message, true); }
    return;
  }
  if (t.dataset.closeterm){
    e.stopPropagation();
    try{ await CC.term.close(t.dataset.closeterm); await loadTerms(); }
    catch(err){ toast(err.message,true); }
    return;
  }
  if (t.dataset.goterm){
    CC.term.show(t.dataset.goterm); setTab('term'); renderTermBar(); return;
  }
  if (t.dataset.tab){ setTab(t.dataset.tab); return; }
  if (t.dataset.mode){
    MODE = t.dataset.mode; localStorage.setItem('ccl.mode', MODE); renderCounts(); return;
  }
  if (t.classList.contains('thinking')){ t.classList.toggle('open'); return; }
  if (t.dataset.expand){ expanded.add(t.dataset.expand); render(); return; }

  if (t.dataset.pin){
    try{ await post('/api/pin',{key:t.dataset.pin}); await load(); }catch(err){ toast(err.message,true); }
    return;
  }
  if (t.dataset.fav){
    const parts = t.dataset.fav.split('|');
    const provider = parts[0], slug = parts[1], id = parts[2];
    try{
      const j = await post('/api/fav', provider === 'codex' ? {provider:'codex', id:id} : {slug:slug, id:id});
      for (const p of DATA){
        for (const s of p.sessions) if (s.id===id && s.provider===provider) s.fav = j.fav;
        p.favCount = p.sessions.filter(x=>x.fav).length;
      }
      renderCounts(); render(); if (openSess) syncPanelHeader();
      toast(j.fav ? '즐겨찾기에 추가' : '즐겨찾기에서 제거');
    }catch(err){ toast(err.message,true); }
    return;
  }
  if (t.dataset.view){
    const parts = t.dataset.view.split('|');
    showSession(parts[0], parts[1], parts[2]); return;
  }
  if (t.dataset.focus){
    try{ const j = await post('/api/focus',{pid:Number(t.dataset.focus)}); toast(j.info||'창을 띄웠습니다'); }
    catch(err){ toast(err.message,true); }
    return;
  }
  if (t.dataset.open){
    try{ await post('/api/open',{cwd:t.dataset.cwd,target:t.dataset.open}); }
    catch(err){ toast(err.message,true); }
    return;
  }
  if (t.dataset.act){
    t.disabled = true;
    try{ await launch(t.dataset.act, t.dataset.cwd, t.dataset.sid, t.dataset.title, t.dataset.provider); }
    catch(err){ toast(err.message,true); }
    setTimeout(function(){ t.disabled = false; }, 900);
  }
});

$('#p-close').onclick = closePanel;
$('#scrim').onclick = closePanel;
$('#p-more').onclick = function(){ openLimit = Math.min(300, openLimit + 60); loadTranscript(true); };
$('#p-fav').onclick = async function(){
  if (!openSess) return;
  try{
    const j = await post('/api/fav', openSess.provider === 'codex'
      ? {provider:'codex', id:openSess.id} : {slug:openSess.slug, id:openSess.id});
    for (const p of DATA){
      for (const s of p.sessions) if (s.id===openSess.id && s.provider===openSess.provider) s.fav = j.fav;
      p.favCount = p.sessions.filter(x=>x.fav).length;
    }
    renderCounts(); syncPanelHeader(); render();
  }catch(err){ toast(err.message,true); }
};
$('#p-resume').onclick = async function(){
  if (!openSess) return;
  try{ await launch('resume', openSess.project.cwd, openSess.id, openSess.title, openSess.provider); closePanel(); }
  catch(err){ toast(err.message,true); }
};
$('#p-goterm').onclick = function(){
  const id = $('#p-goterm').dataset.goterm;
  if (id){ closePanel(); CC.term.show(id); setTab('term'); renderTermBar(); }
};
$('#p-focus').onclick = async function(){
  if (!openSess || !openSess.live) return;
  try{ const j = await post('/api/focus',{pid:openSess.live.pid}); toast(j.info||'창을 띄웠습니다'); }
  catch(err){ toast(err.message,true); }
};
$('#layout').onclick = function(){
  WIDE = !WIDE; localStorage.setItem('ccl.wide', WIDE?'1':'0');
  $('#layout').textContent = WIDE ? '카드' : '넓게'; render();
};
$('#q').addEventListener('input', render);
$('#q').addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ $('#q').value=''; render(); }
  if (e.key === 'Enter'){
    const b = $('#list [data-act="resume"], #list [data-goterm], #list [data-focus]');
    if (b) b.click();
  }
});
// 터미널에 포커스가 있을 때는 전역 단축키가 키를 가로채지 않게 한다
document.addEventListener('keydown', function(e){
  if (e.target.closest && e.target.closest('#termwrap')) return;
  if (e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && openSess) closePanel();
});
// ↻ : 보고 있는 탭에 맞는 것을 다시 읽는다
// 구성 편집의 select 변경
document.addEventListener('change', async function(e){
  // 문서 탭의 프로젝트 고르기
  if (e.target.id === 'md-proj'){
    const dir = e.target.value;
    if (!dir) return;
    try{ await mdSetVault(dir); toast('보관 폴더: ' + dir); }
    catch(err){ toast('폴더를 열지 못했습니다: ' + err.message, true); }
    return;
  }
  if (CC.cfgEdit) CC.cfgEdit.handleChange(e.target);
});
// 구성이 바뀌면 다시 읽어 화면을 맞춘다
CC.cfgEdit.onChanged = function(){
  CC.harness.loadConfig($('#cfgwrap')).then(updateCfgBadge);
};
CC.toast = toast;   // config-edit.js 가 쓴다

$('#refresh').onclick = function(){
  if (TAB === 'graph') return CC.harness.loadGraph($('#graphwrap'));
  if (TAB === 'cfg')   return CC.harness.loadConfig($('#cfgwrap')).then(updateCfgBadge);
  loadUsage();   // 사용량도 ↻ 로 다시 부른다
  return load();
};
function updateCfgBadge(){
  const c = CC.harness.config;
  if (!c) return;
  const warn = c.warnings.filter(function(w){ return w.level === 'warn'; }).length;
  const b = $('#n-cfg');
  b.textContent = warn || c.warnings.length;
  b.style.background = warn ? 'var(--busy)' : '';
  b.style.color = warn ? '#1a1008' : '';
  b.title = warn + ' 주의 / ' + c.warnings.length + ' 건';
}

/* 헤더 높이는 줄바꿈에 따라 달라지므로 실측해서 --hh 에 넣는다.
   고정값을 쓰면 터미널 아래쪽(입력줄·상태줄)이 잘린다. */
function syncHeaderHeight(){
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hh', h + 'px');
  CC.term.refit();
}
window.addEventListener('resize', syncHeaderHeight);
if (window.ResizeObserver) new ResizeObserver(syncHeaderHeight).observe(document.querySelector('header'));

/* ---------------------------------------------------------- 시작 */
CC.term.init($('#termhost'), function(){ renderTermBar(); renderCounts(); });
syncHeaderHeight();

// 실시간 훅 이벤트: 훅 설치 여부와 무관하게 스트림에 붙어 둔다 (설치하면 바로 흐른다)
CC.timeline.init($('#tlwrapouter'));
CC.timeline.start();
CC.live.onUpdate = function(ev){
  CC.harness.onLiveEvent(ev);
  CC.timeline.onEvent();
  // 응답이 끝나면 usage 가 기록되므로 그때 토큰 표시를 갱신한다
  if (ev && (ev.event === 'Stop' || ev.event === 'StopFailure')) {
    setTimeout(loadTokens, 1200);
    setTimeout(loadLimits, 2000);   // 방금 쓴 만큼 한도도 움직였을 것이다
  }
  const n = CC.live.activeCount();
  const agents = CC.live.agentCount();
  [['#n-graph', n], ['#n-flow', n ? (agents ? n + '·' + agents : n) : '']].forEach(function(p){
    const b = $(p[0]);
    b.textContent = p[1] || '';
    b.hidden = !p[1];
  });
};
CC.live.loadStatus().then(function(){ CC.live.connect(); });
document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === TAB); });
$('#layout').textContent = WIDE ? '카드' : '넓게';
load();
loadUsage();    // 세션별 사용량 - 도착하면 render() 가 다시 그려서 채운다
loadTokens();   // 헤더 바 전체 합계
loadLimits();   // 사용 한도 (서버에 물어본다)
// 구성은 경고 개수를 탭 뱃지에 띄우기 위해 시작할 때 한 번 읽어둔다
CC.harness.loadConfig($('#cfgwrap')).then(updateCfgBadge);
setInterval(load, 60000);
setInterval(pollLive, 4000);
setInterval(loadTerms, 5000);
setInterval(loadTokens, 20000);   // 변경된 파일만 다시 읽으므로 가볍다
// 한도는 서버가 1분 캐시하므로 더 자주 물어도 소용없다
setInterval(loadLimits, 60000);
</script>
</body>
</html>
