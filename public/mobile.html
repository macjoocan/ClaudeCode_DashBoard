<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141714">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>대시보드 · 폰</title>
<link rel="stylesheet" href="/m/vendor/xterm.css">
<style>
  :root {
    --bg: #131613; --panel: #1c201c; --panel2: #252a25; --line: #2f352f; --fg: #e7ece7; --dim: #98a399;
    --accent: #5cc796; --accent-ink: #0d140f; --busy: #e7a85a; --bad: #e5786d;
    --mono: ui-monospace, Menlo, Consolas, "D2Coding", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  button { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; min-height: 40px; padding: 0 12px; touch-action: manipulation; }
  button:active { filter: brightness(1.3); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 머리글 */
  header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); min-height: 56px; }
  header > button, header > .seg { flex: none; }
  #back { padding: 0 12px; min-width: 76px; white-space: nowrap; margin-right: 4px; }
  #titlebox { flex: 1; min-width: 0; }
  #title { font-size: 16px; font-weight: 700; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sub { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.idle { background: var(--accent); } .dot.busy { background: var(--busy); animation: pulse 1.2s infinite; }
  .dot.dead, .dot.off { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .seg button { border: 0; border-radius: 0; background: transparent; min-height: 36px; padding: 0 10px; font-size: 13px; color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--panel2); color: var(--fg); font-weight: 700; }

  /* 안내 · 목록 */
  #notice { padding: 28px 20px; color: var(--dim); line-height: 1.7; }
  #notice b { color: var(--fg); display: block; font-size: 17px; margin-bottom: 6px; }
  #listwrap { flex: 1; overflow-y: auto; padding: 10px 12px 24px; display: grid; gap: 10px; align-content: start; }
  #list { display: grid; gap: 10px; }
  #listhead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--dim); padding: 0 2px; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; text-align: left;
    padding: 14px; min-height: 64px; background: var(--panel); }
  .item .dot { grid-row: span 2; width: 10px; height: 10px; }
  .item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { font-size: 13px; color: var(--dim); }
  .item.done { border-color: var(--accent); }

  /* 터미널 */
  #termview { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  #reader { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0; padding: 10px 12px 16px;
    font: 13px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; background: #0e110e; }
  #reader .more { display: block; margin: 0 auto 12px; font-family: inherit; }
  #screen { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; background: #0e110e; }
  #screen .xterm { padding: 4px; }
  #tobottom { position: absolute; right: 14px; bottom: 12px; border-radius: 999px; min-height: 40px; padding: 0 14px;
    background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 700; box-shadow: 0 2px 10px rgba(0,0,0,.4); }

  /* 아래 조작부 */
  #dock { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
  #quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #quick::-webkit-scrollbar { display: none; }
  #quick button { flex: none; border-radius: 999px; min-height: 36px; font-size: 14px; }
  #keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #keys button { min-height: 40px; padding: 0; font-size: 14px; }
  #keys button.danger { color: var(--bad); }
  #compose { display: flex; gap: 8px; align-items: flex-end; }
  #text { flex: 1; min-width: 0; resize: none; font-size: 16px; line-height: 1.4; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-height: 30vh; min-height: 44px; }
  #text:focus { outline: none; border-color: var(--accent); }
  #send { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 700; min-height: 44px; padding: 0 16px; }
  #toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--accent); border-radius: 999px; padding: 8px 16px; font-size: 14px; z-index: 5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <button id="back" hidden aria-label="목록으로">‹ 목록</button>
  <div id="titlebox">
    <p id="title">대시보드</p>
    <div id="sub"><span class="dot off" id="subdot"></span><span id="state">연결 전</span></div>
  </div>
  <div class="seg" id="mode" hidden role="group" aria-label="보기 방식">
    <button id="m-read" aria-pressed="true">글</button>
    <button id="m-screen" aria-pressed="false">화면</button>
  </div>
  <button id="fontup" hidden aria-label="글자 크게">가+</button>
</header>
<div id="toast" hidden></div>
<div id="notice" hidden></div>
<div id="listwrap" hidden>
  <div id="listhead"><span id="listcount"></span><button id="refresh">새로고침</button></div>
  <div id="list"></div>
</div>
<div id="termview" hidden>
  <pre id="reader" aria-live="off"></pre>
  <div id="screen" hidden></div>
  <button id="tobottom" hidden>↓ 맨 아래</button>
</div>
<div id="dock" hidden>
  <div id="quick" aria-label="자주 쓰는 답">
    <button data-say="계속 진행해줘">계속</button>
    <button data-say="yes">yes</button>
    <button data-say="1">1</button>
    <button data-say="2">2</button>
    <button data-say="3">3</button>
    <button data-say="좋아, 그렇게 해줘">좋아</button>
    <button data-say="멈추고 지금 상태를 정리해줘">정리해줘</button>
  </div>
  <div id="keys">
    <button data-k="enter">Enter</button>
    <button data-k="esc">Esc</button>
    <button data-k="up" aria-label="위">↑</button>
    <button data-k="down" aria-label="아래">↓</button>
    <button data-k="tab">Tab</button>
    <button data-k="left" aria-label="왼쪽">←</button>
    <button data-k="right" aria-label="오른쪽">→</button>
    <button data-k="shifttab">⇧Tab</button>
    <button data-k="bs" aria-label="지우기">⌫</button>
    <button data-k="ctrlc" class="danger">^C 중단</button>
  </div>
  <form id="compose">
    <textarea id="text" rows="1" placeholder="보낼 말" autocomplete="off" enterkeyhint="send"></textarea>
    <button type="submit" id="send">보내기</button>
  </form>
</div>
<script src="/m/vendor/xterm.js"></script>
<script src="/m/mobile.js"></script>
</body>
</html>
